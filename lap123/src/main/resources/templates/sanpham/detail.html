<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chi tiết sản phẩm</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 2rem;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 2rem;
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 2rem;
        }

        .card img {
            width: 300px;
            height: auto;
            border-radius: 10px;
            border: 1px solid #ddd;
            object-fit: cover;
        }

        .card-content {
            flex: 1;
        }

        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 1rem;
            color: #333;
        }

        .card-info {
            margin-bottom: 0.8rem;
        }

        .card-info strong {
            display: inline-block;
            width: 160px;
            color: #555;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .badge-open {
            background: #28a745;
            color: #fff;
        }

        .badge-closed {
            background: #dc3545;
            color: #fff;
        }

        .actions {
            margin-top: 1.5rem;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            margin-right: 10px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #007bff;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Ảnh sản phẩm -->
    <div>
        <img th:src="@{'/uploads/' + ${sanpham.HINHANHSP}}" alt="Ảnh sản phẩm">
    </div>

    <!-- Nội dung chi tiết -->
    <div class="card-content">
        <div class="card-title" th:text="${sanpham.TENSP}">Tên sản phẩm</div>

        <div class="card-info"><strong>Mã sản phẩm:</strong> <span th:text="${sanpham.MASP}"></span></div>
        <div class="card-info"><strong>Xuất xứ:</strong> <span th:text="${sanpham.XUATXU}"></span></div>
        <div class="card-info"><strong>Chip:</strong> <span th:text="${sanpham.CHIP}"></span></div>
        <div class="card-info"><strong>Hệ điều hành:</strong> <span th:text="${sanpham.HEDIEUHANH}"></span></div>
        <div class="card-info"><strong>Kích thước màn:</strong> <span th:text="${sanpham.KICHTHUOCMAN}"></span></div>
        <div class="card-info"><strong>Thương hiệu:</strong> <span th:text="${sanpham.THUONGHIEU}"></span></div>

        <div class="card-info">
            <strong>Trạng thái:</strong>
            <span th:if="${sanpham.TRANGTHAI == 1}" class="badge badge-open">Mở bán</span>
            <span th:if="${sanpham.TRANGTHAI == 0}" class="badge badge-closed">Ngừng bán</span>
        </div>

        <div class="actions">
            <a th:href="@{/sanpham}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>
</div>

</body>
</html>
