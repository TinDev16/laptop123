<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Tạo yêu cầu sản xuất</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            rel="stylesheet"
    >
    <style>
        .production-lines { display:grid;gap:14px;margin-top:16px; }
        .production-line { display:grid;grid-template-columns:minmax(250px,1.5fr) minmax(180px,1fr) 150px 180px 44px;gap:12px;align-items:end;padding:16px;border:1px solid #dbe4ee;border-radius:10px;background:#f8fafc; }
        .production-line .ceo-field { margin:0;min-width:0; }
        .production-line-number { grid-column:1/-1;font-size:.78rem;font-weight:800;color:#60758a;text-transform:uppercase;letter-spacing:.05em; }
        .remove-production-line { width:44px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center; }
        @media (max-width:1100px) { .production-line { grid-template-columns:1fr 1fr; } }
        @media (max-width:650px) { .production-line { grid-template-columns:1fr; } .remove-production-line { width:100%; } }
    </style>
</head>

<body>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar('mrp')}"></div>

    <div class="main-wrapper">

        <div th:replace="~{fragments/sidebar :: topbar('Tạo yêu cầu sản xuất', 'MRP / Sản xuất')}"></div>

        <main class="content-body mrp-entry-page">

            <div class="page-header">

                <div>
                    <h1 class="page-title">
                        Tạo yêu cầu sản xuất
                    </h1>

                    <p class="page-description">
                        Chọn BOM hiệu lực, giao người phụ trách và xác định hạn hoàn thành.
                    </p>
                </div>

                <a
                        class="btn btn-back"
                        th:href="@{/san-xuat/yeu-cau}"
                >
                    <i class="fas fa-arrow-left"></i>
                    Về danh sách
                </a>

            </div>


            <!-- THÔNG BÁO LỖI -->

            <p
                    th:if="${error}"
                    th:text="${error}"
                    class="alert alert-danger">
            </p>


            <!-- FORM -->

            <form
                    method="post"
                    th:action="@{/san-xuat/yeu-cau}"
                    class="content-card ceo-form-card"
                    id="productionOrderForm"
            >

                <div class="content-card-body">

                    <input
                            type="hidden"
                            th:name="${_csrf.parameterName}"
                            th:value="${_csrf.token}"
                            th:if="${_csrf != null}"
                    >

                    <div class="ceo-field ceo-field-full" style="margin-bottom:20px;">
                        <label for="batchName">
                            Tên đợt sản xuất
                            <span class="ceo-required">*</span>
                        </label>
                        <input id="batchName"
                               name="batchName"
                               type="text"
                               minlength="3"
                               maxlength="150"
                               required
                               class="form-control"
                               placeholder="Ví dụ: Sản xuất bổ sung hàng tháng 10">
                        <small>Dùng chung cho tất cả thành phẩm được thêm trong lần giao việc này.</small>
                    </div>


                    <h2 class="ceo-section-title">
                        <i class="fas fa-clipboard-list"></i>
                        Thành phẩm cần sản xuất
                    </h2>

                    <button type="button" id="addProductionLine" class="btn btn-outline">
                        <i class="fas fa-plus"></i> Thêm thành phẩm
                    </button>


                    <div id="productionLines"
                         class="production-lines"
                         th:data-boms-url="@{/san-xuat/yeu-cau/products}">

                        <div class="production-line">

                            <div class="production-line-number">Thành phẩm 1</div>

                            <!-- CHỌN SẢN PHẨM -->
                            <div class="ceo-field ceo-field-full">
                                <label for="productId">
                                    Sản phẩm
                                    <span class="ceo-required">*</span>
                                </label>

                                <select
                                        id="productId"
                                        class="form-control product-select"
                                        required
                                >
                                    <option value="">-- Chọn sản phẩm trước --</option>
                                    <option
                                            th:each="product : ${products}"
                                            th:value="${product.masp}"
                                            th:text="${product.tensp}"
                                    ></option>
                                </select>
                            </div>

                            <!-- CHỌN BOM THEO SẢN PHẨM -->
                            <div class="ceo-field">
                                <label for="bomId">
                                    Phiên bản BOM
                                    <span class="ceo-required">*</span>
                                </label>

                                <select
                                        id="bomId"
                                        name="bomId"
                                        class="form-control bom-select"
                                        required
                                        disabled
                                >
                                    <option value="">-- Vui lòng chọn sản phẩm trước --</option>
                                </select>
                            </div>


                            <!-- NHÂN VIÊN -->

                            <div class="ceo-field">

                                <label for="employeeId">
                                    Nhân viên phụ trách
                                    <span class="ceo-required">*</span>
                                </label>

                                <select
                                        id="employeeId"
                                        name="employeeId"
                                        required
                                        class="form-control"
                                >

                                    <option value="">
                                        -- Chọn nhân viên --
                                    </option>

                                    <option
                                            th:each="employee : ${employees}"
                                            th:value="${employee.manv}"
                                            th:text="${employee.hoten}"
                                    ></option>

                                </select>

                            </div>


                            <!-- SỐ LƯỢNG -->

                            <div class="ceo-field">

                                <label for="quantity">
                                    Số lượng cần sản xuất
                                    <span class="ceo-required">*</span>
                                </label>

                                <input
                                        id="quantity"
                                        name="quantity"
                                        type="number"
                                        min="1"
                                        step="1"
                                        required
                                        class="form-control"
                                        placeholder="Nhập số lượng"
                                >

                            </div>


                            <!-- DEADLINE -->

                            <div class="ceo-field">

                                <label for="deadline">
                                    Hạn hoàn thành
                                    <span class="ceo-required">*</span>
                                </label>

                                <input
                                        id="deadline"
                                        name="deadline"
                                        type="date"
                                        required
                                        class="form-control"
                                        autocomplete="off"
                                >

                            </div>

                            <button type="button" class="btn btn-danger remove-production-line" aria-label="Xóa thành phẩm">
                                <i class="fas fa-trash"></i>
                            </button>

                        </div>

                    </div>


                    <!-- GHI CHÚ -->

                    <div class="ceo-field ceo-field-full" style="margin-top:20px;">

                        <label for="orderNote">
                            Ghi chú
                        </label>

                        <textarea
                                id="orderNote"
                                name="note"
                                maxlength="255"
                                rows="3"
                                class="form-control"
                                placeholder="Yêu cầu kỹ thuật hoặc ưu tiên sản xuất"
                        ></textarea>

                    </div>

                    <!-- ACTION -->

                    <div class="ceo-form-actions">

                        <a
                                class="btn btn-back"
                                th:href="@{/san-xuat/yeu-cau}"
                        >
                            <i class="fas fa-arrow-left"></i>
                            Trở lại
                        </a>

                        <button
                                type="submit"
                                class="btn btn-primary"
                        >
                            <i class="fas fa-paper-plane"></i>
                            Giao việc
                        </button>

                    </div>

                </div>

            </form>

        </main>

    </div>

</div>


<script>
    (function () {
        const container = document.getElementById("productionLines");
        const addButton = document.getElementById("addProductionLine");
        const form = document.getElementById("productionOrderForm");
        const bomsUrl = container.dataset.bomsUrl;
        const template = container.querySelector(".production-line").cloneNode(true);

        function localToday() {
            const now = new Date();
            return now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0");
        }

        async function loadBoms(line) {
            const productSelect = line.querySelector(".product-select");
            const bomSelect = line.querySelector(".bom-select");
            const productId = productSelect.value;

            bomSelect.replaceChildren();
            bomSelect.disabled = true;

            const placeholder = document.createElement("option");
            placeholder.value = "";

            if (!productId) {
                placeholder.textContent = "-- Vui lòng chọn sản phẩm trước --";
                bomSelect.appendChild(placeholder);
                return;
            }

            placeholder.textContent = "-- Đang tải BOM --";
            bomSelect.appendChild(placeholder);

            try {
                const response = await fetch(
                    bomsUrl + "/" + encodeURIComponent(productId) + "/boms",
                    {
                        method: "GET",
                        headers: { "Accept": "application/json" }
                    }
                );

                if (!response.ok) {
                    throw new Error("Không thể tải danh sách BOM.");
                }

                const boms = await response.json();

                // Nếu người dùng đổi sản phẩm trong lúc đang tải, bỏ kết quả cũ.
                if (productSelect.value !== productId) {
                    return;
                }

                bomSelect.replaceChildren();

                const firstOption = document.createElement("option");
                firstOption.value = "";
                firstOption.textContent = boms.length > 0
                    ? "-- Chọn phiên bản BOM --"
                    : "-- Sản phẩm chưa có BOM hợp lệ --";
                bomSelect.appendChild(firstOption);

                boms.forEach(function (bom) {
                    const option = document.createElement("option");
                    option.value = bom.mabom;
                    option.textContent = bom.phienban + " — " + bom.tensp;
                    bomSelect.appendChild(option);
                });

                bomSelect.disabled = boms.length === 0;
            } catch (error) {
                bomSelect.replaceChildren();

                const option = document.createElement("option");
                option.value = "";
                option.textContent = "-- Lỗi tải BOM, vui lòng thử lại --";
                bomSelect.appendChild(option);

                alert(error.message || "Không thể tải danh sách BOM.");
            }
        }

        function prepareLine(line, reset) {
            if (reset) {
                line.querySelectorAll("[id]").forEach(function (element) {
                    element.removeAttribute("id");
                });

                line.querySelectorAll("label[for]").forEach(function (label) {
                    label.removeAttribute("for");
                });

                line.querySelector(".product-select").value = "";

                const bomSelect = line.querySelector(".bom-select");
                bomSelect.replaceChildren();
                const bomPlaceholder = document.createElement("option");
                bomPlaceholder.value = "";
                bomPlaceholder.textContent = "-- Vui lòng chọn sản phẩm trước --";
                bomSelect.appendChild(bomPlaceholder);
                bomSelect.disabled = true;

                line.querySelector('select[name="employeeId"]').value = "";
                line.querySelector('input[name="quantity"]').value = "1";
            }

            const deadline = line.querySelector('input[name="deadline"]');
            deadline.min = localToday();
            if (reset || !deadline.value) {
                deadline.value = localToday();
            }

            line.querySelector(".product-select").onchange = function () {
                loadBoms(line);
            };

            line.querySelector(".remove-production-line").onclick = function () {
                line.remove();
                renumber();
            };
        }

        function renumber() {
            const lines = container.querySelectorAll(".production-line");
            lines.forEach(function (line, index) {
                line.querySelector(".production-line-number").textContent =
                    "Thành phẩm " + (index + 1);
                line.querySelector(".remove-production-line").disabled = lines.length === 1;
            });
        }

        prepareLine(container.querySelector(".production-line"), false);
        renumber();

        addButton.addEventListener("click", function () {
            const line = template.cloneNode(true);
            prepareLine(line, true);
            container.appendChild(line);
            window.Lap123Number?.enhance(line);
            renumber();
        });

        form.addEventListener("submit", function (event) {
            const selected = Array.from(
                form.querySelectorAll(".production-line")
            ).map(function (line) {
                const bomId = line.querySelector('select[name="bomId"]').value;
                const employeeId = line.querySelector('select[name="employeeId"]').value;
                return bomId && employeeId ? bomId + ":" + employeeId : "";
            });

            const hasDuplicate = selected.some(function (value, index) {
                return value && selected.indexOf(value) !== index;
            });

            if (hasDuplicate) {
                event.preventDefault();
                alert("Không được giao trùng cùng thành phẩm/BOM cho cùng một nhân viên trong một yêu cầu.");
            }
        });
    })();
</script>

<script>
    (function () {

        const deadlineInput =
            document.getElementById("deadline");

        if (!deadlineInput) {
            return;
        }

        /*
         * Lấy ngày hiện tại theo local time của trình duyệt.
         *
         * Không dùng toISOString() vì UTC có thể làm lệch ngày
         * ở một số múi giờ.
         */

        const today = new Date();

        const year = today.getFullYear();

        const month = String(
            today.getMonth() + 1
        ).padStart(2, "0");

        const day = String(
            today.getDate()
        ).padStart(2, "0");

        const todayString =
            year + "-" + month + "-" + day;


        /*
         * Không cho chọn ngày trước hôm nay.
         */

        deadlineInput.min = todayString;


        /*
         * Nếu input chưa có giá trị thì mặc định hôm nay.
         *
         * Quan trọng:
         * value luôn có dạng YYYY-MM-DD
         */

        if (!deadlineInput.value) {
            deadlineInput.value = todayString;
        }


        /*
         * Chặn dữ liệu date bị sai trước khi submit.
         */

        const form =
            document.getElementById("productionOrderForm");

        if (form) {

            form.addEventListener("submit", function (event) {

                const value =
                    deadlineInput.value;

                /*
                 * LocalDate của Spring phải nhận:
                 * YYYY-MM-DD
                 */

                const validDate =
                    /^\d{4}-\d{2}-\d{2}$/.test(value);

                if (!validDate) {

                    event.preventDefault();

                    alert(
                        "Hạn hoàn thành không hợp lệ. " +
                        "Vui lòng chọn lại ngày."
                    );

                    deadlineInput.focus();

                    return;
                }


                /*
                 * Không cho submit năm có số chữ số khác 4.
                 */

                const yearPart =
                    value.substring(0, 4);

                if (!/^\d{4}$/.test(yearPart)) {

                    event.preventDefault();

                    alert(
                        "Năm của hạn hoàn thành không hợp lệ."
                    );

                    deadlineInput.focus();

                    return;
                }

            });

        }

    })();
</script>

</body>
</html>
