<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        .table {
            min-width: 1200px; /* Đảm bảo đủ cho tất cả cột */
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.98rem;
            white-space: nowrap; /* Không xuống dòng */
        }
        @media (max-width: 900px) {
            .table th, .table td {
                padding: 8px 4px;
                font-size: 0.92rem;
            }
            .table {
                min-width: 900px;
            }
        }
        @media (max-width: 700px) {
            .table {
                min-width: 700px;
            }
        }

    .bg-red-100 {
        background-color: #ffe5e5;
    }
    .modal {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4);
    }
    .modal-content {
        background: white; padding: 20px; border-radius: 10px;
        width: 400px;
    }
    .hidden { display: none; }
</style>
</head>

<body>
<!-- Header -->
<header class="header">
    <div class="header-content">
        <div class="header-left">
            <i class="fas fa-laptop"></i>
            <h1 class="header-title">Quản lý Cửa hàng Laptop</h1>
        </div>
        <!-- Đặt nút đăng nhập/đăng xuất admin ở bên trái, gần ngày -->
        <div class="header-right">
            <div id="admin-auth">
                <button id="logout-btn" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
        </div>
    </div>
</header>

<!-- Navigation -->
<nav class="nav">
    <div class="nav-content">
        <a class="nav-tab" data-tab="products" href="/">
            <i class="fas fa-home"></i>
            <span>Trang chủ</span>
        </a>

        <a class="nav-tab" data-tab="products" href="/sanpham">
            <i class="fas fa-box"></i>
            <span>Sản phẩm</span>
        </a>

        <a class="nav-tab" data-tab="import-slips" href="/phieunhap">
            <i class="fas fa-arrow-down"></i>
            <span>Phiếu nhập</span>
        </a>

        <a class="nav-tab" data-tab="export-slips" href="/phieuxuat">
            <i class="fas fa-arrow-up"></i>
            <span>Phiếu xuất</span>
        </a>

        <a class="nav-tab" data-tab="customers" href="/khachhang">
            <i class="fas fa-users"></i>
            <span>Khách hàng</span>
        </a>

        <a class="nav-tab" data-tab="suppliers" href="/ncc">
            <i class="fas fa-building"></i>
            <span>Nhà cung cấp</span>
        </a>

        <a class="nav-tab" data-tab="employees" href="/nhanvien">
            <i class="fas fa-user-tie"></i>
            <span>Nhân viên</span>
        </a>

        <a class="nav-tab active" data-tab="inventory" href="/tonkho">
                <i class="fas fa-warehouse"></i>
        <span>Tồn kho</span>
        </a>

        <a class="nav-tab" data-tab="brands" href="/thuonghieu">
            <i class="fas fa-tags"></i>
            <span>Thương hiệu</span>
        </a>
    </div>
</nav>
<!-- Main Content -->
<main class="main">
    <!-- Products Tab -->
    <div id="products" class="tab-content active">
        <div class="page-header">
            <h2 class="page-title">Kho sản phẩm</h2>
            <div class="page-actions">
                <a href="#" class="btn btn-success" onclick="exportExcel()">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm sản phẩm..." onkeyup="filterProducts()">
            </div>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Hình ảnh</th>
                    <th>Hệ điều hành</th>   
                    <th>Thương hiệu</th>
                    <th>Số lượng tồn</th>
                    <th>Giá nhập</th>
                    <th>Giá bán</th>
                    <th>Ngày nhập</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody id="products-table">
                    <tr th:each="tk : ${tonkho}"
                        th:classappend="${tk.sanpham.TRANGTHAI == 1} ? 'bg-red-100 text-gray-700' : ''">
                
                        <td class="font-semibold" th:text="${tk.sanpham.MASP}"></td>
                        <td th:text="${tk.sanpham.TENSP}"></td>
                        <td>
                            <img th:src="@{'/uploads/' + ${tk.sanpham.HINHANHSP}}"
                                 alt="Ảnh sản phẩm" style="width:60px; border-radius:6px;">
                        </td>
                        <td th:text="${tk.sanpham.HEDIEUHANH}"></td>
                        <td th:text="${tk.sanpham.thuonghieu.TENTH}"></td>
                        <td th:text="${tk.sanpham.SOLUONGTON}"></td>
                        <td th:text="${#numbers.formatDecimal(tk.sanpham.GIANHAP, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                        <td th:text="${#numbers.formatDecimal(tk.sanpham.GIABAN, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                        <td th:text="${#dates.format(tk.sanpham.NGAYCAPNHAT, 'dd/MM/yyyy')}"></td>
                        <td th:text="${tk.sanpham.TRANGTHAI == 0 ? 'Mở bán' : 'Đóng'}"></td>
                    </tr>
                </tbody>
                                 
            </table>
        </div>
    </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
function filterProducts() {
    const searchInput = document.getElementById('product-search').value.toLowerCase();
    const brandFilter = document.getElementById('brand-filter').value.toLowerCase();
    const rows = document.querySelectorAll('#products-table tr');
    let visibleCount = 0;

    rows.forEach(row => {
        const tenSp = row.querySelector('td:nth-child(3)')?.textContent.toLowerCase() || '';
        const thuongHieu = row.querySelector('td:nth-child(8)')?.textContent.toLowerCase() || '';
        let show = true;

        if (searchInput && !tenSp.includes(searchInput)) {
            show = false;
        }
        if (brandFilter && thuongHieu !== brandFilter) {
            show = false;
        }
        row.style.display = show ? '' : 'none';
        if (show) visibleCount++;
    });

    let noResultRow = document.getElementById('no-result-row');
    if (!noResultRow) {
        noResultRow = document.createElement('tr');
        noResultRow.id = 'no-result-row';
        noResultRow.innerHTML = `<td colspan="13" style="text-align:center;color:#dc3545;font-weight:500;">Không có sản phẩm phù hợp</td>`;
        document.getElementById('products-table').appendChild(noResultRow);
    }
    noResultRow.style.display = (visibleCount === 0) ? '' : 'none';
}

function exportExcel() {
    const table = document.querySelector('.table');
    const wb = XLSX.utils.table_to_book(table, {sheet: "TonKho"});
    XLSX.writeFile(wb, 'tonkho.xlsx');
}
</script>
</body>
</html>
