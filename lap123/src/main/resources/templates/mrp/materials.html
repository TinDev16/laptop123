<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nguyên vật liệu</title>

    <link rel="stylesheet"
          th:href="@{/style.css(v='20261014-2')}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet">

    <style>
        .material-category-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0 12px;
        }

        .material-category-title {
            margin-left: 11px;
        }

        .material-category-count {
            margin-left: auto;
            margin-right: 20px;
        }

        .inventory-empty {
            color: #dc2626;
            font-weight: 600;
        }

        /* Chỉ tạo ranh giới giữa các bảng, giữ nguyên bảng màu hệ thống */
        .material-category-list {
            display: grid;
            gap: 22px;
            padding: 22px;
        }

        .material-category-group {
            overflow: hidden;
            border: 1px solid #d9e1ea;
            border-radius: 12px;
            box-shadow: 0 5px 16px rgba(15, 23, 42, 0.06);
        }

        .material-category-group .material-category-header {
            box-sizing: border-box;
            min-height: 64px;
            padding-top: 14px;
            padding-bottom: 14px;
            border-bottom: 1px solid #d9e1ea;
        }

        .material-category-group .material-category-table {
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .material-category-group table {
            margin: 0;
        }

        .material-category-group tbody tr:last-child td {
            border-bottom: 0;
        }

        @media (max-width: 820px) {
            .material-category-list {
                gap: 16px;
                padding: 14px;
            }

            .material-category-group .material-category-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .material-category-group .material-category-title {
                flex-wrap: wrap;
            }

            .material-category-group .material-category-count {
                margin-left: 46px;
            }
        }

        @media (max-width: 520px) {
            .material-category-list {
                padding: 10px;
            }

            .material-category-group {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar('nvl')}"></div>

    <div class="main-wrapper">

        <div th:replace="~{fragments/sidebar :: topbar('Nguyên vật liệu', 'Kho / NVL')}"></div>

        <main class="content-body">

            <h1>Nguyên vật liệu</h1>

            <p th:if="${success}"
               th:text="${success}"
               style="color:#15803d">
            </p>

            <!-- NÚT THAO TÁC -->
            <p>

                <!-- Thêm NVL -->
                <a th:href="@{/nguyen-vat-lieu/create}"
                   class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Thêm NVL
                </a>


            </p>


            <div class="content-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Danh mục nguyên vật liệu
                    </h2>

                    <span class="record-count"
                          th:text="${#lists.size(materials) + ' bản ghi'}">
            0 bản ghi
        </span>

                </div>


                <!-- =============================== -->
                <!-- DANH SÁCH THEO TỪNG LOẠI NVL -->
                <!-- =============================== -->

                <!-- =============================== -->
                <!-- DANH SÁCH NVL THEO TỪNG LOẠI -->
                <!-- =============================== -->

                <div th:if="${!#maps.isEmpty(materialGroups)}"
                     class="material-category-list">

                    <div th:each="group : ${materialGroups}"
                         class="material-category-group">

                        <!-- =============================== -->
                        <!-- HEADER LOẠI -->
                        <!-- =============================== -->

                        <div class="material-category-header">

                            <div class="material-category-title">

                                <i class="fas fa-layer-group"></i>

                                <span>
    Loại <span th:text="${group.key}">nguyên vật liệu</span>
</span>

                            </div>

                            <span class="material-category-count"
                                  th:text="${#lists.size(group.value) + ' NVL'}">
        0 NVL
    </span>

                        </div>


                        <!-- =============================== -->
                        <!-- BẢNG NVL -->
                        <!-- =============================== -->

                        <div class="table-container material-category-table">

                            <table>

                                <thead>

                                <tr>
                                    <th>Mã</th>
                                    <th>Tên</th>
                                    <th>Đơn vị</th>
                                    <th>Tồn</th>
                                    <th>Giá nhập</th>
                                    <th>Trạng thái</th>
                                    <th>Thao tác</th>
                                </tr>

                                </thead>


                                <tbody>

                                <tr th:each="m : ${group.value}">

                                    <!-- Mã -->
                                    <td th:text="${m.manvl_code}">
                                    </td>


                                    <!-- Tên -->
                                    <td th:text="${m.tennvl}">
                                    </td>


                                    <!-- Đơn vị -->
                                    <td th:text="${m.donvitinh}">
                                    </td>


                                    <!-- Tồn -->
                                    <td>

                                        <div class="material-stock-cell">

        <span data-number
              th:text="${m.soluongton}">
        </span>

                                            <!-- Hết NVL -->
                                            <small
                                                    th:if="${m.soluongton == 0}"
                                                    class="inventory-warning inventory-empty">
                                                Hết
                                            </small>

                                            <!-- Sắp hết -->
                                            <small
                                                    th:if="${m.soluongton > 0 and m.soluongton <= m.ton_toithieu}"
                                                    class="inventory-warning">
                                                Sắp hết
                                            </small>

                                        </div>

                                    </td>


                                    <!-- Giá nhập -->
                                    <td data-number
                                        th:text="${m.dongianhap}">
                                    </td>


                                    <!-- Trạng thái -->
                                    <td>

                        <span
                                class="status-badge material-lifecycle-status"
                                th:classappend="${m.trangthai == 1
                                    ? ' status-success material-lifecycle-status--active'
                                    : ' status-neutral'}"
                                th:data-status="${m.trangthai == 1
                                    ? 'HOAT_DONG'
                                    : 'NGUNG_SU_DUNG'}"
                                th:text="${m.trangthai_label}">
                        </span>

                                    </td>


                                    <!-- Thao tác -->
                                    <td>

                                        <a th:href="@{/nguyen-vat-lieu/{id}(id=${m.manvl})}">
                                            Sửa
                                        </a>

                                    </td>

                                </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>


                <!-- =============================== -->
                <!-- KHÔNG CÓ DỮ LIỆU -->
                <!-- =============================== -->

                <div th:if="${#maps.isEmpty(materialGroups)}"
                     class="material-empty-state">

                    Chưa có dữ liệu để hiển thị.

                </div>



            </div>

        </main>

    </div>

</div>

</body>
</html>
