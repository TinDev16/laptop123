<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý thương hiệu</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('thuonghieu')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Quản lý Thương hiệu', 'Đối tác / Thương hiệu')}"></div>
<main class="content-body directory-page">
<div class="page-header"><div><h1 class="page-title">Thương hiệu</h1><p class="page-description">Danh mục thương hiệu đang hợp tác và được sử dụng cho thành phẩm.</p></div><div class="page-actions"><a th:href="@{/thuonghieu/create}" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm thương hiệu</a><button type="button" class="btn btn-success" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Xuất Excel</button></div></div>
<div class="search-filters"><div class="search-input"><i class="fas fa-search"></i><input type="search" id="directory-search" placeholder="Tìm theo mã hoặc tên thương hiệu" oninput="filterDirectory()"></div></div>
<div class="content-card"><div class="table-container"><table id="brand-table" class="table directory-table"><thead><tr><th>Mã thương hiệu</th><th>Tên thương hiệu</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
<tbody><tr th:each="brand : ${thuonghieu}" th:if="${brand.TRANGTHAI == 0}"><td class="font-semibold" th:text="${brand.MATHUONGHIEU}"></td><td th:text="${brand.TENTHUONGHIEU}"></td><td><span class="directory-status status-badge status-success"><i class="fas fa-circle"></i> Hoạt động</span></td><td><div class="table-actions"><a class="btn btn-icon btn-outline" title="Sửa thương hiệu" th:href="@{/edit-thuonghieu/{id}(id=${brand.MATHUONGHIEU})}"><i class="fas fa-edit"></i></a></div></td></tr>
<tr class="empty-row" th:if="${#lists.isEmpty(thuonghieu)}"><td colspan="4">Chưa có thương hiệu đang hoạt động.</td></tr><tr id="no-result-row" class="empty-row" hidden><td colspan="4">Không có thương hiệu phù hợp.</td></tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script>
function filterDirectory(){const query=document.getElementById('directory-search').value.trim().toLowerCase();let visible=0;document.querySelectorAll('#brand-table tbody tr:not(.empty-row)').forEach(row=>{const match=row.textContent.toLowerCase().includes(query);row.hidden=!match;if(match)visible++});document.getElementById('no-result-row').hidden=visible!==0}
function exportExcel(){const book=XLSX.utils.book_new();const sheet=XLSX.utils.table_to_sheet(document.getElementById('brand-table'));XLSX.utils.book_append_sheet(book,sheet,'ThuongHieu');XLSX.writeFile(book,'thuong-hieu.xlsx')}
</script></body></html>
