<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Chi tiết BOM</title>

    <link rel="stylesheet" th:href="@{/style.css}">

    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            rel="stylesheet">
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('bom')}"></div>

    <div class="main-wrapper">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Chi tiết BOM', 'MRP / BOM')}"></div>

        <main class="content-body detail-page">

            <!-- ========================= -->
            <!-- HEADER -->
            <!-- ========================= -->

            <div class="page-header">

                <div>

                    <h1
                            class="page-title"
                            th:text="${bom.tensp + ' / ' + bom.phienban}">
                    </h1>

                    <p class="page-description">
                        Định mức nguyên vật liệu áp dụng cho một đơn vị thành phẩm.
                    </p>

                </div>


                <a
                        class="btn btn-back"
                        th:href="${backUrl}">

                    <i class="fas fa-arrow-left"></i>

                    Về danh sách

                </a>

            </div>


            <!-- ========================= -->
            <!-- ERROR -->
            <!-- ========================= -->

            <p
                    th:if="${error}"
                    th:text="${error}"
                    class="alert alert-danger">
            </p>


            <!-- ========================= -->
            <!-- BOM SUMMARY -->
            <!-- ========================= -->

            <div class="content-card">

                <div class="content-card-body bom-summary">

                    <!-- TRẠNG THÁI -->
                    <div>

                        <span class="detail-label">
                            Trạng thái
                        </span>

                        <span
                                class="status-pill"
                                th:text="${bom.trangthai}">
                        </span>

                    </div>


                    <!-- GHI CHÚ -->
                    <div>

                        <span class="detail-label">
                            Ghi chú
                        </span>

                        <span
                                th:text="${bom.ghichu != null and !#strings.isEmpty(bom.ghichu)
                                    ? bom.ghichu
                                    : 'Không có ghi chú'}">
                        </span>

                    </div>


                    <!-- NGỪNG SỬ DỤNG -->
                    <form
                            th:if="${bom.trangthai == 'HIEU_LUC'}"
                            th:action="@{/bom/{id}/disable(id=${bom.mabom})}"
                            method="post"
                            onsubmit="return confirm('Ngừng sử dụng BOM này? BOM sẽ không còn được chọn cho yêu cầu sản xuất mới.')">

                        <input
                                type="hidden"
                                th:name="${_csrf.parameterName}"
                                th:value="${_csrf.token}"
                                th:if="${_csrf != null}">

                        <button
                                type="submit"
                                class="btn btn-disable">

                            <i class="fas fa-ban"></i>

                            Ngừng sử dụng

                        </button>

                    </form>

                </div>

            </div>


            <!-- ========================= -->
            <!-- DANH SÁCH NGUYÊN VẬT LIỆU -->
            <!-- ========================= -->

            <div class="content-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Danh sách nguyên vật liệu
                    </h2>

                    <span
                            class="record-count"
                            th:text="${#lists.size(details) + ' dòng'}">
                    </span>

                </div>


                <div class="table-container">

                    <table class="table">

                        <thead>

                        <tr>

                            <th>Mã NVL</th>

                            <th>Tên NVL</th>

                            <th>Loại</th>

                            <th>Định mức</th>

                            <th>Đơn vị</th>

                            <th>Hao hụt (%)</th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="line : ${details}">

                            <!-- MÃ NVL -->
                            <td
                                    th:text="${line.manvl_code}">
                            </td>


                            <!-- TÊN NVL -->
                            <td
                                    th:text="${line.tennvl}">
                            </td>


                            <!-- LOẠI NVL -->
                            <td
                                    th:text="${line.tenloai != null
                                        ? line.tenloai
                                        : 'Chưa phân loại'}">
                            </td>


                            <!-- ĐỊNH MỨC -->
                            <td
                                    data-number
                                    th:text="${line.soluong_dinhmuc}">
                            </td>


                            <!-- ĐƠN VỊ -->
                            <td
                                    th:text="${line.donvitinh}">
                            </td>


                            <!-- HAO HỤT -->
                            <td
                                    data-number
                                    th:text="${line.ty_le_hao_hut}">
                            </td>

                        </tr>


                        <!-- EMPTY -->
                        <tr
                                class="empty-row"
                                th:if="${#lists.isEmpty(details)}">

                            <td colspan="6">
                                BOM chưa có nguyên vật liệu.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

</body>

</html>
