<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết xuất NVL</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('xuat-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Chi tiết đề nghị xuất NVL', 'Kho / Xuất NVL')}"></div>
<main class="content-body"><div class="page-header"><div><h1 class="page-title" th:text="${'Phiếu xuất NVL #' + issue.maphieu}"></h1><p class="page-description">Kiểm tra thông tin và số lượng vật tư trước khi phê duyệt.</p></div><a class="btn btn-back" th:href="@{/kho/xuat-nvl}"><i class="fas fa-arrow-left"></i> Về danh sách</a></div>
<p th:if="${success}" th:text="${success}" class="alert alert-success"></p><p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
<div class="content-card"><div class="content-card-body">
<h2 class="ceo-section-title"><i class="fas fa-file-alt"></i> Thông tin đề nghị</h2>
<div class="detail-meta"><span th:text="${'Yêu cầu #' + issue.mayeucau}"></span><span th:text="${'Sản phẩm: ' + issue.tensp}"></span><span th:text="${'Người lập: ' + issue.hoten}"></span><span><strong>Trạng thái:</strong> <span th:text="${issue.trangthai}"></span></span></div>
<p th:if="${issue.ghichu != null and !#strings.isEmpty(issue.ghichu)}" th:text="${issue.ghichu}"></p><p th:if="${issue.lydo != null}" class="alert alert-danger" th:text="${'Lý do từ chối: ' + issue.lydo}"></p>
<div th:if="${manager and issue.trangthai == 'CHO_DUYET'}" class="approval-panel">
<form class="approval-approve" th:action="@{/kho/xuat-nvl/{id}/duyet(id=${issue.maphieu})}" method="post" onsubmit="return confirm('Duyệt và xuất nguyên vật liệu?')"><button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Duyệt và xuất kho</button></form>
<form class="reject-form" th:action="@{/kho/xuat-nvl/{id}/tu-choi(id=${issue.maphieu})}" method="post" onsubmit="return confirm('Xác nhận từ chối phiếu này?')"><div class="ceo-field"><label for="rejectReason">Lý do từ chối <span class="ceo-required">*</span></label><input id="rejectReason" name="reason" required maxlength="255" class="form-control" placeholder="Nhập lý do cụ thể để người lập xử lý"></div><button type="submit" class="btn btn-reject"><i class="fas fa-times"></i> Từ chối</button></form>
</div>
<h2 class="ceo-section-title"><i class="fas fa-cubes"></i> Vật tư đề nghị xuất</h2><div class="table-container"><table class="table"><thead><tr><th>Mã NVL</th><th>Tên NVL</th><th>Số lượng</th><th>Đơn vị</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.manvl_code}"></td><td th:text="${l.tennvl}"></td><td th:text="${l.soluong}"></td><td th:text="${l.donvitinh}"></td></tr></tbody></table></div>
<div class="ceo-form-actions"><a class="btn btn-back" th:href="@{/kho/xuat-nvl}"><i class="fas fa-arrow-left"></i> Trở lại danh sách</a></div>
</div></div></main></div></div></body></html>
