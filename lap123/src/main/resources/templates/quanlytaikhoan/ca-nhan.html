<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thông tin cá nhân</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('ca-nhan')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Thông tin cá nhân', 'Tài khoản / Cá nhân')}"></div><main class="content-body"><h1>Thông tin cá nhân</h1>
<div class="content-card" style="max-width:680px"><div class="content-card-header"><h2 class="content-card-title">Hồ sơ tài khoản</h2></div><div class="content-card-body"><p><strong>Tài khoản:</strong> <span th:text="${account.email}"></span></p><p><strong>Vai trò:</strong> <span th:text="${account.vaitro.ten == 'QUAN_LY_KHO' ? 'Quản lý kho' : 'Nhân viên'}"></span></p><div th:if="${account.nhanvien != null}"><p><strong>Nhân viên:</strong> <span th:text="${account.nhanvien.HOTEN}"></span></p><p><strong>Mã nhân viên:</strong> <span th:text="${account.nhanvien.MANV}"></span></p><p><strong>Số điện thoại:</strong> <span th:text="${account.nhanvien.SDT}"></span></p></div></div></div>
</main></div></div></body></html>
