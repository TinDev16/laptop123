<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Báo cáo MRP</title>

  <link rel="stylesheet" th:href="@{/style.css(v='20260924-1')}">

  <link
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet">
</head>

<body>

<div class="app-container">

  <div th:replace="~{fragments/sidebar :: sidebar('baocao')}"></div>

  <div class="main-wrapper">

    <div th:replace="~{fragments/sidebar :: topbar('Báo cáo MRP', 'Báo cáo')}"></div>

    <main class="content-body">

      <h1>Báo cáo MRP</h1>

      <!-- Bộ lọc -->
      <!-- Bộ lọc -->
      <form th:action="@{/baocao}"
            method="get"
            style="display:flex;gap:0.5rem;flex-wrap:wrap">

        <input
                type="number"
                data-number-format="plain"
                name="month"
                min="1"
                max="12"
                placeholder="Tháng">

        <input
                type="number"
                data-number-format="plain"
                name="quarter"
                min="1"
                max="4"
                placeholder="Quý">

        <input
                type="number"
                data-number-format="plain"
                name="year"
                min="2000"
                max="2100"
                placeholder="Năm">

        <button type="submit">
          Xem
        </button>

      </form>

      <p th:text="${'Từ ' + from + ' đến ' + to}"></p>



      <!-- Tổng hợp báo cáo -->
      <div class="report-summary-grid">

        <!-- Tổng NVL nhập -->
        <div class="content-card report-summary-card">

          <strong>Tổng NVL nhập</strong>

          <h2
                  data-number
                  th:text="${totals.getOrDefault('NHAP_NVL', 0)}">
          </h2>

        </div>


        <!-- Tổng NVL xuất -->
        <div class="content-card report-summary-card">

          <strong>Tổng NVL xuất</strong>

          <h2
                  data-number
                  th:text="${totals.getOrDefault('XUAT_NVL', 0)}">
          </h2>

        </div>


        <!-- Tổng thành phẩm nhập -->
        <div class="content-card report-summary-card">

          <strong>Tổng thành phẩm nhập</strong>

          <h2
                  data-number
                  th:text="${totals.getOrDefault('NHAP_THANH_PHAM', 0)}">
          </h2>

        </div>


        <!-- Tổng thành phẩm xuất -->
        <div class="content-card report-summary-card">

          <strong>Tổng thành phẩm xuất</strong>

          <h2
                  data-number
                  th:text="${totals.getOrDefault('XUAT_THANH_PHAM', 0)}">
          </h2>

        </div>


        <!-- Tổng NVL tồn -->
        <div class="content-card report-summary-card">

          <strong>Tổng NVL tồn</strong>

          <h2
                  data-number
                  th:text="${currentStock.getOrDefault('NVL_TON', 0)}">
          </h2>

        </div>


        <!-- Tổng thành phẩm tồn -->
        <div class="content-card report-summary-card">

          <strong>Tổng sản phẩm tồn</strong>

          <h2
                  data-number
                  th:text="${currentStock.getOrDefault('THANH_PHAM_TON', 0)}">
          </h2>

        </div>

      </div>


      <!-- BIỂU ĐỒ -->
      <h2>Biểu đồ nhập và xuất</h2>

      <div
              style="
                    display:grid;
                    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
                    gap:1rem;
                ">

        <!-- Biểu đồ NVL -->
        <div
                class="content-card"
                style="padding:1rem">

          <canvas
                  id="nvlChart"
                  aria-label="Nhập và xuất NVL">
          </canvas>

        </div>


        <!-- Biểu đồ thành phẩm -->
        <div
                class="content-card"
                style="padding:1rem">

          <canvas
                  id="finishedChart"
                  aria-label="Nhập và xuất thành phẩm">
          </canvas>

        </div>

      </div>

      <h2>Biểu đồ tồn kho</h2>

      <div
              style="
        display:grid;
        grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
        gap:1rem;
    ">

        <div
                class="content-card"
                style="padding:1rem">

          <canvas
                  id="stockChart"
                  aria-label="Tồn kho nguyên vật liệu và thành phẩm">
          </canvas>

        </div>

      </div>


      <!-- Chart.js -->
      <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

      <script th:inline="javascript">

        if (window.Chart) {

          const nvlIn = Number(
                  /*[[${totals.getOrDefault('NHAP_NVL', 0)}]]*/ 0
          );

          const nvlOut = Number(
                  /*[[${totals.getOrDefault('XUAT_NVL', 0)}]]*/ 0
          );

          const finishedIn = Number(
                  /*[[${totals.getOrDefault('NHAP_THANH_PHAM', 0)}]]*/ 0
          );

          const finishedOut = Number(
                  /*[[${totals.getOrDefault('XUAT_THANH_PHAM', 0)}]]*/ 0
          );

          const nvlStock = Number(
                  /*[[${currentStock.getOrDefault('NVL_TON', 0)}]]*/ 0
          );

          const finishedStock = Number(
                  /*[[${currentStock.getOrDefault('THANH_PHAM_TON', 0)}]]*/ 0
          );


          const makeChart = (
                  id,
                  label,
                  received,
                  issued
          ) => {

            const canvas =
                    document.getElementById(id);

            if (!canvas) {
              return;
            }

            new Chart(canvas, {

              type: 'bar',

              data: {

                labels: [
                  'Nhập',
                  'Xuất'
                ],

                datasets: [

                  {
                    label: label,

                    data: [
                      received,
                      issued
                    ],

                    backgroundColor: [
                      '#2563eb',
                      '#f97316'
                    ]
                  }

                ]

              },

              options: {

                responsive: true,

                maintainAspectRatio: true,

                scales: {

                  y: {
                    beginAtZero: true
                  }

                }

              }

            });

          };

          const makeStockChart = () => {

            const canvas =
                    document.getElementById('stockChart');

            if (!canvas) {
              return;
            }

            new Chart(canvas, {

              type: 'bar',

              data: {

                labels: [
                  'Nguyên vật liệu',
                  'Thành phẩm'
                ],

                datasets: [

                  {
                    label: 'Tồn kho',

                    data: [
                      nvlStock,
                      finishedStock
                    ],

                    backgroundColor: [
                      '#2563eb',
                      '#16a34a'
                    ]
                  }

                ]

              },

              options: {

                responsive: true,

                maintainAspectRatio: true,

                scales: {

                  y: {
                    beginAtZero: true
                  }

                }

              }

            });

          };


          makeChart(
                  'nvlChart',
                  'Nguyên vật liệu',
                  nvlIn,
                  nvlOut
          );


          makeChart(
                  'finishedChart',
                  'Thành phẩm',
                  finishedIn,
                  finishedOut
          );

          makeStockChart();

        }

      </script>

    </main>

  </div>

</div>

</body>
</html>
