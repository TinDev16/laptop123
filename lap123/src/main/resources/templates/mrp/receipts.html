<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Nhập NVL</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('nhap-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Nhập nguyên vật liệu', 'Kho / Nhập NVL')}"></div><main class="content-body">
<h1>Phiếu nhập nguyên vật liệu</h1><p><a class="btn btn-primary" th:href="@{/kho/nhap-nvl/create}">Tạo phiếu nhập</a></p>
<div class="content-card"><div class="content-card-header"><h2 class="content-card-title">Phiếu nhập nguyên vật liệu</h2><span class="record-count" th:text="${#lists.size(receipts) + ' bản ghi'}">0 bản ghi</span></div><div class="table-container"><table><thead><tr><th>Mã</th><th>Nhà cung cấp</th><th>Người lập</th><th>Ngày lập</th><th>Tổng tiền</th><th>Trạng thái</th><th>Ghi chú</th><th></th></tr></thead><tbody>
<tr th:each="r : ${receipts}"><td th:text="${r.maphieu}"></td><td th:text="${r.tenncc}"></td><td th:text="${r.hoten}"></td><td th:text="${r.ngaytao}"></td><td th:text="${r.tongtien}"></td><td th:text="${r.trangthai}"></td><td th:text="${r.ghichu}"></td><td><a th:href="@{/kho/nhap-nvl/{id}(id=${r.maphieu})}">Xem</a></td></tr>
<tr class="empty-row" th:if="${#lists.isEmpty(receipts)}"><td colspan="8">Chưa có dữ liệu để hiển thị.</td></tr></tbody></table></div></div></main></div></div></body></html>
