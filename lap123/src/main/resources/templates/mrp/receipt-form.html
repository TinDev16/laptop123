<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo phiếu nhập NVL</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('nhap-nvl')}"></div><div class="main-wrapper">
<div th:replace="~{fragments/sidebar :: topbar('Tạo phiếu nhập NVL', 'Kho / Nhập NVL')}"></div>
<main class="content-body mrp-entry-page">
<div class="page-header"><div><h1 class="page-title">Tạo phiếu nhập nguyên vật liệu</h1><p class="page-description">Ghi nhận lô vật tư, số lượng và đơn giá từ nhà cung cấp.</p></div><a class="btn btn-back" th:href="@{/kho/nhap-nvl}"><i class="fas fa-arrow-left"></i> Về danh sách</a></div>
<p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
<form th:action="@{/kho/nhap-nvl}" method="post" class="content-card ceo-form-card">
<div class="content-card-body">
<h2 class="ceo-section-title"><i class="fas fa-file-invoice"></i> Thông tin phiếu nhập</h2>
<div class="ceo-form-grid">
<div class="ceo-field"><label for="supplierId">Nhà cung cấp <span class="ceo-required">*</span></label><select id="supplierId" name="supplierId" required class="form-control"><option value="">-- Chọn nhà cung cấp --</option><option th:each="s : ${suppliers}" th:value="${s.mancc}" th:text="${s.tenncc}"></option></select></div>
<div class="ceo-field ceo-field-full"><label for="receiptNote">Ghi chú</label><textarea id="receiptNote" name="note" maxlength="255" rows="3" class="form-control" placeholder="Số hóa đơn, điều kiện giao nhận hoặc ghi chú nội bộ"></textarea></div>
</div>
<h2 class="ceo-section-title"><i class="fas fa-boxes"></i> Chi tiết nguyên vật liệu</h2>
<div id="receipt-lines" class="line-editor"><div class="receipt-line line-row">
<div class="ceo-field"><label>Nguyên vật liệu</label><select name="materialId" class="form-control" required><option th:each="m : ${materials}" th:value="${m.manvl}" th:text="${m.manvl_code + ' - ' + m.tennvl}"></option></select></div>
<div class="ceo-field"><label>Số lượng</label><input name="quantity" type="number" min="1" value="1" required class="form-control" oninput="total()"></div>
<div class="ceo-field"><label>Đơn giá</label><input name="price" type="number" min="0" step="0.01" value="0" required class="form-control" oninput="total()"></div>
<button type="button" class="btn-line-remove" onclick="removeReceiptLine(this)"><i class="fas fa-trash-alt"></i> Xóa</button>
</div></div>
<button type="button" class="btn btn-line-add" onclick="addReceiptLine()"><i class="fas fa-plus"></i> Thêm dòng vật tư</button>
<div class="form-summary"><span>Tổng tiền dự kiến:</span><strong id="total">0</strong><span>VNĐ</span></div>
<div class="ceo-form-actions"><a class="btn btn-back" th:href="@{/kho/nhap-nvl}"><i class="fas fa-arrow-left"></i> Trở lại</a><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Lưu phiếu nhập</button></div>
</div></form>
</main></div></div>
<script>
function total(){let sum=0;document.querySelectorAll('.receipt-line').forEach(row=>{sum+=(Lap123Number.parse(row.querySelector('[name=quantity]').value)||0)*(Lap123Number.parse(row.querySelector('[name=price]').value)||0)});document.getElementById('total').textContent=sum.toLocaleString('vi-VN')}
function addReceiptLine(){const source=document.querySelector('.receipt-line');const clone=source.cloneNode(true);clone.querySelector('[name=quantity]').value='1';clone.querySelector('[name=price]').value='0';document.getElementById('receipt-lines').appendChild(clone);total()}
function removeReceiptLine(button){if(document.querySelectorAll('.receipt-line').length>1){button.closest('.receipt-line').remove();total()}}
</script></body></html>
