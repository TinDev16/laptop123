<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Chi tiết phiếu nhập</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('nhap-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Chi tiết phiếu nhập', 'Kho / Nhập NVL')}"></div><main class="content-body">
<h1 th:text="${'Phiếu nhập #' + receipt.maphieu}"></h1><p th:if="${success}" th:text="${success}" style="color:#15803d"></p><p th:if="${error}" th:text="${error}" style="color:#b91c1c"></p>
<p th:text="${'Nhà cung cấp: ' + receipt.tenncc + ' · Người lập: ' + receipt.hoten}"></p><p th:text="${'Trạng thái: ' + receipt.trangthai}"></p><p th:text="${receipt.ghichu}"></p>
<form th:if="${receipt.trangthai == 'NHAP_NHAP'}" th:action="@{/kho/nhap-nvl/{id}/confirm(id=${receipt.maphieu})}" method="post" onsubmit="return confirm('Xác nhận nhập kho?')"><button type="submit" class="btn btn-primary">Xác nhận nhập kho</button></form>
<div class="content-card"><div class="table-container"><table><thead><tr><th>Mã NVL</th><th>Tên NVL</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.manvl_code}"></td><td th:text="${l.tennvl}"></td><td th:text="${l.soluong}"></td><td th:text="${l.dongia}"></td><td th:text="${l.thanhtien}"></td></tr></tbody></table></div></div>
<a th:href="@{/kho/nhap-nvl}">Về danh sách</a></main></div></div></body></html>
