<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Tạo BOM</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container">
  <div th:replace="~{fragments/sidebar :: sidebar('bom')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: topbar('Tạo BOM', 'MRP / BOM')}"></div>
    <main class="content-body"><h1>Tạo BOM</h1>
      <p th:if="${error}" th:text="${error}" style="color:#b91c1c"></p>
      <form th:action="@{/bom}" method="post" class="content-card" style="padding:1.5rem">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
        <label>Sản phẩm</label><select name="productId" required class="form-control">
          <option th:each="product : ${products}" th:value="${product.masp}" th:text="${product.tensp}"></option>
        </select>
        <label>Phiên bản</label><input name="version" required maxlength="30" class="form-control">
        <label>Ghi chú</label><input name="note" maxlength="255" class="form-control">
        <h2>Nguyên vật liệu</h2>
        <div id="lines"><div class="bom-line" style="display:flex;gap:1rem;margin:0.75rem 0">
          <select name="materialId" required class="form-control">
            <option th:each="material : ${materials}" th:value="${material.manvl}" th:text="${material.manvl_code + ' - ' + material.tennvl}"></option>
          </select>
          <input name="quantity" type="number" min="0.001" step="0.001" required value="1" aria-label="Định mức" class="form-control">
          <input name="waste" type="number" min="0" max="999.99" step="0.01" required value="0" aria-label="Hao hụt phần trăm" class="form-control">
          <button type="button" onclick="if (document.querySelectorAll('.bom-line').length > 1) this.parentElement.remove()">Xóa</button>
        </div></div>
        <button type="button" onclick="document.getElementById('lines').appendChild(document.querySelector('.bom-line').cloneNode(true))">Thêm NVL</button>
        <button class="btn btn-primary" type="submit">Lưu BOM</button>
      </form>
    </main>
  </div>
</div></body></html>
