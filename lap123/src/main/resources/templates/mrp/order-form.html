<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Tạo yêu cầu sản xuất</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container">
  <div th:replace="~{fragments/sidebar :: sidebar('mrp')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: topbar('Tạo yêu cầu sản xuất', 'MRP / Sản xuất')}"></div>
    <main class="content-body"><h1>Tạo yêu cầu sản xuất</h1>
      <p th:if="${error}" th:text="${error}" style="color:#b91c1c"></p>
      <form method="post" th:action="@{/san-xuat/yeu-cau}" class="content-card" style="padding:1.5rem">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
        <label>Sản phẩm / BOM</label><select name="bomId" required class="form-control">
          <option th:each="bom : ${boms}" th:value="${bom.mabom}" th:text="${bom.tensp + ' / ' + bom.phienban}"></option>
        </select>
        <label>Nhân viên phụ trách</label><select name="employeeId" required class="form-control">
          <option th:each="employee : ${employees}" th:value="${employee.manv}" th:text="${employee.hoten}"></option>
        </select>
        <label>Số lượng</label><input name="quantity" type="number" min="1" required class="form-control">
        <label>Hạn hoàn thành</label><input name="deadline" type="date" required class="form-control">
        <label>Ghi chú</label><input name="note" maxlength="255" class="form-control">
        <button type="submit" class="btn btn-primary">Giao việc</button>
      </form>
    </main>
  </div>
</div></body></html>
