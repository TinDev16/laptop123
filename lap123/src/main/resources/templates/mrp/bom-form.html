<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tạo BOM</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('bom')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Tạo BOM', 'MRP / BOM')}"></div>
<main class="content-body mrp-entry-page"><div class="page-header"><div><h1 class="page-title">Tạo định mức sản xuất</h1><p class="page-description">Khai báo phiên bản BOM, định mức vật tư và tỷ lệ hao hụt.</p></div><a class="btn btn-back" th:href="@{/bom}"><i class="fas fa-arrow-left"></i> Về danh sách</a></div>
<p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
<form th:action="@{/bom}" method="post" class="content-card ceo-form-card"><div class="content-card-body">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
<h2 class="ceo-section-title"><i class="fas fa-sitemap"></i> Thông tin BOM</h2>
<div class="ceo-form-grid cols-3">
<div class="ceo-field"><label for="productId">Thành phẩm <span class="ceo-required">*</span></label><select id="productId" name="productId" required class="form-control"><option value="">-- Chọn thành phẩm --</option><option th:each="product : ${products}" th:value="${product.masp}" th:text="${product.tensp}"></option></select></div>
<div class="ceo-field"><label for="version">Phiên bản <span class="ceo-required">*</span></label><input id="version" name="version" required maxlength="30" class="form-control" placeholder="Ví dụ: V1.0"></div>
<div class="ceo-field"><label for="bomNote">Ghi chú</label><input id="bomNote" name="note" maxlength="255" class="form-control" placeholder="Mô tả thay đổi phiên bản"></div>
</div>
<h2 class="ceo-section-title"><i class="fas fa-cubes"></i> Danh sách nguyên vật liệu</h2>
<div id="lines" class="line-editor"><div class="bom-line line-row">
<div class="ceo-field"><label>Nguyên vật liệu</label><select name="materialId" required class="form-control"><option th:each="material : ${materials}" th:value="${material.manvl}" th:text="${material.manvl_code + ' - ' + material.tennvl}"></option></select></div>
<div class="ceo-field"><label>Định mức</label><input name="quantity"
                                                     type="number"
                                                     min="0.001"
                                                     step="1"
                                                     required
                                                     value="1"
                                                     class="form-control"></div>
<div class="ceo-field"><label>Hao hụt (%)</label><input name="waste" type="number" min="0" max="999.99" step="0.01" required value="0" class="form-control"></div>
<button type="button" class="btn-line-remove" onclick="removeBomLine(this)"><i class="fas fa-trash-alt"></i> Xóa</button>
</div></div>
<button type="button" class="btn btn-line-add" onclick="addBomLine()"><i class="fas fa-plus"></i> Thêm nguyên vật liệu</button>
<div class="ceo-form-actions ceo-form-actions--end"><button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Lưu BOM</button></div>
</div></form></main></div></div>
<script>
function addBomLine(){const clone=document.querySelector('.bom-line').cloneNode(true);clone.querySelector('[name=quantity]').value='1';clone.querySelector('[name=waste]').value='0';document.getElementById('lines').appendChild(clone)}
function removeBomLine(button){if(document.querySelectorAll('.bom-line').length>1)button.closest('.bom-line').remove()}
</script></body></html>
