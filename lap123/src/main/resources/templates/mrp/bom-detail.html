<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Chi tiết BOM</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container">
  <div th:replace="~{fragments/sidebar :: sidebar('bom')}"></div>
  <div class="main-wrapper">
    <div th:replace="~{fragments/sidebar :: topbar('Chi tiết BOM', 'MRP / BOM')}"></div>
    <main class="content-body">
      <p th:if="${error}" th:text="${error}" style="color:#b91c1c"></p>
      <h1 th:text="${bom.tensp + ' / ' + bom.phienban}"></h1>
      <p th:text="${bom.ghichu}"></p><p th:text="${bom.trangthai}"></p>
      <form th:if="${bom.trangthai == 'HIEU_LUC'}" th:action="@{/bom/{id}/disable(id=${bom.mabom})}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}">
        <button type="submit">Ngừng sử dụng</button>
      </form>
      <div class="content-card"><div class="table-container"><table>
        <thead><tr><th>Mã NVL</th><th>Tên NVL</th><th>Định mức</th><th>Đơn vị</th><th>Hao hụt (%)</th></tr></thead>
        <tbody><tr th:each="line : ${details}">
          <td th:text="${line.manvl_code}"></td><td th:text="${line.tennvl}"></td>
          <td th:text="${line.soluong_dinhmuc}"></td><td th:text="${line.donvitinh}"></td>
          <td th:text="${line.ty_le_hao_hut}"></td>
        </tr></tbody>
      </table></div></div>
      <a th:href="@{/bom}">Về danh sách</a>
    </main>
  </div>
</div></body></html>
