<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo tài khoản</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('taikhoan')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Tạo tài khoản', 'Hệ thống / Tài khoản')}"></div>
<main class="content-body"><div class="page-header"><h1 class="page-title">Tạo tài khoản</h1><a th:href="@{/quanlytaikhoan}" class="btn btn-outline">Về danh sách</a></div><p th:if="${error}" th:text="${error}" class="text-red-600"></p>
<form th:action="@{/quanlytaikhoan/newAccount}" method="post" class="content-card" style="padding:1.5rem;max-width:620px">
<div class="form-group"><label for="employee">Nhân viên</label><select id="employee" name="nhanvienId" required class="form-control"><option value="">Chọn nhân viên chưa có tài khoản</option><option th:each="nv : ${employees}" th:value="${nv.MANV}" th:text="${nv.HOTEN}"></option></select></div>
<div class="form-group"><label for="email">Tên đăng nhập / email</label><input id="email" name="email" required maxlength="255" class="form-control"></div>
<div class="form-group"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" required class="form-control"></div>
<div class="form-group"><label for="role">Vai trò</label><select id="role" name="roleCode" required class="form-control"><option value="NHAN_VIEN" selected>Nhân viên</option><option value="QUAN_LY_KHO">Quản lý kho</option></select></div>
<button type="submit" class="btn btn-primary">Tạo tài khoản</button></form></main></div></div></body></html>
