<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa yêu cầu sản xuất</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet">

    <style>
        .edit-card {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .order-info {
            display: grid;
            grid-template-columns: 180px 1fr;
            row-gap: 12px;
            column-gap: 20px;
            padding: 18px 20px;
            margin-bottom: 25px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .order-info-label {
            font-weight: 600;
            color: #475569;
        }

        .order-info-value {
            color: #1e293b;
        }

        .edit-form {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }

        .edit-form .form-group {
            margin-bottom: 18px;
        }

        .edit-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #334155;
        }

        .edit-form input,
        .edit-form select,
        .edit-form textarea {
            width: 100%;
            box-sizing: border-box;
        }

        .edit-form input,
        .edit-form select {
            height: 40px;
        }

        .edit-form small {
            display: block;
            margin-top: 6px;
            color: #64748b;
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            padding-top: 18px;
            border-top: 1px solid #e2e8f0;
        }

        .message {
            max-width: 850px;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .message-error {
            background: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message-success {
            background: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>

<body>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar('mrp')}"></div>

    <div class="main-wrapper">

        <div th:replace="~{fragments/sidebar :: topbar(
            'Chỉnh sửa yêu cầu sản xuất',
            'MRP / Sản xuất'
        )}"></div>

        <main class="content-body">

            <h1>Chỉnh sửa yêu cầu sản xuất</h1>

            <!-- Thông báo lỗi -->
            <div th:if="${error}"
                 class="message message-error">

                <i class="fas fa-exclamation-circle"></i>
                <span th:text="${error}"></span>

            </div>

            <!-- Thông báo thành công -->
            <div th:if="${success}"
                 class="message message-success">

                <i class="fas fa-check-circle"></i>
                <span th:text="${success}"></span>

            </div>


            <div class="content-card edit-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Yêu cầu #
                        <span th:text="${order.mayeucau}"></span>
                    </h2>

                </div>


                <!-- THÔNG TIN HIỆN TẠI -->
                <div class="order-info">

                    <div class="order-info-label">
                        Sản phẩm
                    </div>

                    <div class="order-info-value"
                         th:text="${order.tensp}">
                    </div>


                    <div class="order-info-label">
                        Đã hoàn thành
                    </div>

                    <div class="order-info-value"
                         th:text="${order.soluonghoanthanh}">
                    </div>


                    <div class="order-info-label">
                        Trạng thái
                    </div>

                    <div class="order-info-value">
                        <span
                                class="status-pill"
                                th:text="${
                                    order.trangthai == 'HUY' ? 'Hủy' :
                                    order.trangthai == 'HOAN_THANH' ? 'Hoàn thành' :
                                    order.trangthai
                                }">
                        </span>
                    </div>

                </div>


                <!-- FORM -->
                <form
                        class="edit-form"
                        th:action="@{/san-xuat/yeu-cau/{id}/edit(id=${order.mayeucau})}"
                        method="post">


                    <!-- Số lượng -->
                    <div class="form-group">

                        <label for="quantity">
                            Số lượng sản xuất
                        </label>

                        <input
                                type="number"
                                id="quantity"
                                name="quantity"
                                min="1"
                                required
                                th:min="${order.soluonghoanthanh}"
                                th:value="${order.soluongyeucau}">

                        <small>
                            Không được nhỏ hơn số lượng đã hoàn thành:
                            <strong th:text="${order.soluonghoanthanh}"></strong>
                        </small>

                    </div>


                    <!-- Hạn -->
                    <div class="form-group">

                        <label for="deadline">
                            Hạn hoàn thành
                        </label>

                        <input
                                type="date"
                                id="deadline"
                                name="deadline"
                                required
                                th:value="${order.hanhoanthanh}">

                    </div>


                    <!-- Nhân viên -->
                    <div class="form-group">

                        <label for="employeeId">
                            Nhân viên phụ trách
                        </label>

                        <select
                                id="employeeId"
                                name="employeeId"
                                required>

                            <option
                                    th:each="employee : ${employees}"
                                    th:value="${employee.manv}"
                                    th:text="${employee.hoten}"
                                    th:selected="${employee.manv == order.manv}">
                            </option>

                        </select>

                    </div>


                    <!-- Ghi chú -->
                    <div class="form-group">

                        <label for="note">
                            Ghi chú
                        </label>

                        <textarea
                                id="note"
                                name="note"
                                maxlength="255"
                                rows="4"
                                placeholder="Nhập ghi chú..."
                                th:text="${order.ghichu}">
                        </textarea>

                    </div>


                    <!-- NÚT -->
                    <div class="edit-actions">

                        <button
                                type="submit"
                                class="btn btn-primary">

                            <i class="fas fa-save"></i>
                            Lưu thay đổi

                        </button>

                        <a
                                th:href="${order.madot != null}
        ? @{/san-xuat/yeu-cau/dot/{id}(id=${order.madot})}
        : @{/san-xuat/yeu-cau}"
                                class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i>
                            Quay lại
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </div>

</div>

</body>
</html>
