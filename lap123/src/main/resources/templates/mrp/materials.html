<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Nguyên vật liệu</title>

    <link rel="stylesheet"
          th:href="@{/style.css(v='20261001-2')}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet">
</head>

<body>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar('nvl')}"></div>

    <div class="main-wrapper">

        <div th:replace="~{fragments/sidebar :: topbar('Nguyên vật liệu', 'Kho / NVL')}"></div>

        <main class="content-body">

            <h1>Nguyên vật liệu</h1>

            <p th:if="${success}"
               th:text="${success}"
               style="color:#15803d">
            </p>

            <p>
                <a th:href="@{/nguyen-vat-lieu/create}"
                   class="btn btn-primary">
                    Thêm NVL
                </a>
            </p>


            <div class="content-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Danh mục nguyên vật liệu
                    </h2>

                    <span class="record-count"
                          th:text="${#lists.size(materials) + ' bản ghi'}">
                        0 bản ghi
                    </span>

                </div>

                <div class="table-container">

                    <table>

                        <thead>

                        <tr>
                            <th>Mã</th>
                            <th>Tên</th>
                            <th>Đơn vị</th>
                            <th>Tồn</th>
                            <th>Tồn tối thiểu</th>
                            <th>Giá nhập</th>
                            <th>Trạng thái</th>
                            <th></th>
                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="m : ${materials}">

                            <!-- Mã -->
                            <td th:text="${m.manvl_code}">
                            </td>

                            <!-- Tên -->
                            <td th:text="${m.tennvl}">
                            </td>

                            <!-- Đơn vị -->
                            <td th:text="${m.donvitinh}">
                            </td>

                            <!-- Tồn -->
                            <td>

                                <div class="material-stock-cell">

                                    <span data-number
                                          th:text="${m.soluongton}">
                                    </span>

                                    <small
                                            th:if="${m.soluongton <= m.ton_toithieu}"
                                            class="inventory-warning">
                                        Sắp hết
                                    </small>

                                </div>

                            </td>

                            <!-- Tồn tối thiểu -->
                            <td data-number
                                th:text="${m.ton_toithieu}">
                            </td>

                            <!-- Giá nhập -->
                            <td data-number
                                th:text="${m.dongianhap}">
                            </td>

                            <!-- Trạng thái -->
                            <td>

                                <span
                                        class="status-badge material-lifecycle-status"
                                        th:classappend="${m.trangthai == 1
                                            ? ' status-success material-lifecycle-status--active'
                                            : ' status-neutral'}"
                                        th:data-status="${m.trangthai == 1
                                            ? 'HOAT_DONG'
                                            : 'NGUNG_SU_DUNG'}"
                                        th:text="${m.trangthai_label}">
                                </span>

                            </td>

                            <!-- Thao tác -->
                            <td>

                                <a th:href="@{/nguyen-vat-lieu/{id}(id=${m.manvl})}">
                                    Sửa
                                </a>

                            </td>

                        </tr>

                        <tr class="empty-row"
                            th:if="${#lists.isEmpty(materials)}">

                            <td colspan="8">
                                Chưa có dữ liệu để hiển thị.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
