<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<style>
    .bg-red-100 {
    background-color: #ffe5e5;
    }
    .modal {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4);
    }
    .modal-content {
        background: white; padding: 20px; border-radius: 10px;
        width: 400px;
    }
    .hidden { display: none; }

    .bg-red-100 {
        background-color: #ffe5e5;
    }

    .table-container h3 {
        color: #333;
        font-weight: 600;
    }

    /* Xóa gạch chân cho tất cả link trong nav */
    .nav a {
        text-decoration: none;
        color: inherit; /* Giữ nguyên màu gốc */
    }

    /* Tùy chỉnh khi rê chuột (hover) */
    .nav a:hover {
        text-decoration: none;
        color: #007bff;
    }

    .nav-tab.active {
        color: #007bff;
        font-weight: 600;
    }

</style>
<body>
<div class="app-container">
    <!-- SIDEBAR BÊN TRÁI -->
    <div th:replace="~{fragments/sidebar :: sidebar('nhanvien')}"></div>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Quản Lý Nhân Viên', 'Hệ thống / Nhân viên')}"></div>

        <main class="content-body">
            <div id="products" class="tab-content active" style="display: block;">
        <div class="page-header">
            <h2 class="page-title">Quản lý Nhân viên</h2>
            <div class="page-actions">
                <a th:href="@{/nhanvien/create}" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Thêm nhân viên
                </a>
                <a href="#" class="btn btn-success" onclick="exportExcel('products')">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm nhân viên..." onkeyup="filterProducts()">
            </div>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã NV</th>
                    <th>Họ tên</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Số điện thoại</th>
                    <th>Ngày tham gia</th>
                    <th>Trạng thái</th>
                    <!-- <th>Ghi chú</th> -->
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="employees-table">
                <tr th:each="nv : ${nhanvien}" 
                    th:if="${nv.TRANGTHAI} == 0">
                    <td class="font-semibold" th:text="${nv.MANV}"></td>
                    <td th:text="${nv.HOTEN}"></td>
                    <td th:text="${nv.GIOITINH}"></td>
                    <td th:text="${nv.NGAYSINH != null ? #dates.format(nv.NGAYSINH, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${nv.SDT}"></td>
                    <td th:text="${nv.NGAYTHAMGIA != null ? #dates.format(nv.NGAYTHAMGIA, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${nv.TRANGTHAI == 0 ? 'Hoạt động' : 'Nghỉ việc'}"></td>
                    <!-- <td th:text="${nv.GHICHU != null ? nv.GHICHU : ''}"></td> -->
                    <td>
                        <div class="table-actions">
                            <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-nhanvien/{id}(id=${nv.MANV})}">
                                <i class="fas fa-edit"></i>
                            </a>
                            <button
                            type="button"
                            class="btn btn-danger"
                            th:attr="data-id=${nv.MANV}, data-ten=${nv.HOTEN}"
                            onclick="showDeleteModal(this)">
                                Xóa
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <h1 style="margin: 20px 0 10px;">🚫Nhân viên đã nghỉ việc</h1>
            <table class="table bg-red-100">
                <thead>
                <tr>
                    <th>Mã NV</th>
                    <th>Họ tên</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Số điện thoại</th>
                    <th>Ngày tham gia</th>
                    <th>Trạng thái</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="employees-table">
                <tr th:each="nv : ${nhanvien}"
                    th:if="${nv.TRANGTHAI} == 1">
                    <td class="font-semibold" th:text="${nv.MANV}"></td>
                    <td th:text="${nv.HOTEN}"></td>
                    <td th:text="${nv.GIOITINH}"></td>
                    <td th:text="${nv.NGAYSINH != null ? #dates.format(nv.NGAYSINH, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${nv.SDT}"></td>
                    <td th:text="${nv.NGAYTHAMGIA != null ? #dates.format(nv.NGAYTHAMGIA, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${nv.TRANGTHAI == 0 ? 'Hoạt động' : 'Nghỉ việc'}"></td>
                    <td th:text="${nv.GHICHU != null ? nv.GHICHU : ''}"></td>
                    <td>
                        <div class="table-actions">
                            <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-nhanvien/{id}(id=${nv.MANV})}">
                                <i class="fas fa-edit"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        </main>
    </div>
</div>
<!-- Modal xác nhận xóa -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3>Xóa nhân viên</h3>
        <p id="deleteMessage"></p>
        <form th:action="@{/delete-nhanvien}" method="POST">
            <input type="hidden" id="deleteId" name="id">
            <textarea name="GHICHU" placeholder="Nhập lý do xóa..." required></textarea>
            <div class="modal-actions">
                <button type="submit" class="btn btn-danger">Xác nhận</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
    function showDeleteModal(button) {
        const id = button.getAttribute('data-id');
        const ten = button.getAttribute('data-ten');
    
        // Gán giá trị vào modal
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteMessage").textContent = `Bạn có chắc chắn muốn xóa nhân viên "${ten}" không?`;
    
        // Hiện modal
        document.getElementById("deleteModal").classList.remove("hidden");
    }
    
    function closeModal() {
        document.getElementById("deleteModal").classList.add("hidden");
    }
</script>

<!-- Thư viện xuất Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// =========================
// 🔍 TÌM KIẾM CẢ 2 BẢNG
// =========================
function filterProducts() {
    const searchInput = document.getElementById('product-search').value.toLowerCase();

    // Lấy tất cả các hàng trong cả 2 bảng
    const rows = document.querySelectorAll('.table tbody tr');
    let visibleCount = 0;

    rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        const match = text.includes(searchInput);
        row.style.display = match ? '' : 'none';
        if (match) visibleCount++;
    });

    // Nếu không có kết quả hiển thị
    let noResult = document.getElementById('no-result-row');
    if (!noResult) {
        noResult = document.createElement('tr');
        noResult.id = 'no-result-row';
        noResult.innerHTML = `<td colspan="8" style="text-align:center;color:#dc3545;font-weight:500;">
            Không có nhân viên phù hợp
        </td>`;
        document.querySelector('.table tbody').appendChild(noResult);
    }

    noResult.style.display = visibleCount === 0 ? '' : 'none';
}

// =========================
// 📤 XUẤT EXCEL CẢ 2 BẢNG
// =========================
function exportExcel() {
    const tables = document.querySelectorAll('.table');
    if (tables.length === 0) {
        alert("Không tìm thấy bảng nhân viên!");
        return;
    }

    // Tạo workbook Excel mới
    const wb = XLSX.utils.book_new();

    // Lặp qua 2 bảng và tạo sheet riêng
    tables.forEach((table, index) => {
        const sheetName = index === 0 ? "NhanVien_HoatDong" : "NhanVien_NghiViec";
        const ws = XLSX.utils.table_to_sheet(table);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    // Xuất file Excel
    XLSX.writeFile(wb, 'nhanvien.xlsx');
}
</script>

</body>
</html>
