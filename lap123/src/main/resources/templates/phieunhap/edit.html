<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa phiếu nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<style>
    /* Tăng độ rõ ràng cho select nhà cung cấp */
    select.form-select, select {
        border-radius: 10px;
        border: 1px solid #007bff;
        padding: 8px;
    }

    /* Nút xác nhận nhập */
    .btn-confirm {
        background-color: #28a745;
        color: white;
        font-weight: 500;
        border-radius: 8px;
        transition: 0.3s;
    }

    .btn-confirm:hover {
        background-color: #218838;
    }

    /* Format giá nhập khi nhập */
    input.price-input {
        text-align: right;
    }
</style>
<body class="container mt-4">
    <h1 class="text-primary mb-4 text-center">
        Chỉnh sửa Phiếu Nhập #<span th:text="${phieunhap.MAPHIEUNHAP}"></span>
    </h1>

    <form id="phieunhapForm" th:action="@{/update-phieunhap}" th:object="${phieunhap}" method="post">
        <input type="hidden" th:field="*{MAPHIEUNHAP}" />
        <input type="hidden" id="trangthai" th:field="*{TRANGTHAI}" />

        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-bold">Nhà cung cấp</label>
                    <select class="form-select" th:field="*{ncc.MANCC}">
                        <option th:each="n : ${nccList}" 
                                th:value="${n.MANCC}" 
                                th:text="${n.TENNCC}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Nhân viên nhập</label>
                    <select class="form-select" th:field="*{nhanvien}">
                        <option th:each="nv : ${nhanvienList}"
                                th:value="${nv.MANV}"
                                th:text="${nv.HOTEN}"
                                th:selected="${nv.MANV == phieunhap.nhanvien.MANV}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Thời gian</label>
                    <input type="date" class="form-control" th:field="*{THOIGIAN}" />
                </div>

                <!-- Loại bỏ select trạng thái, thay bằng nút -->
                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-confirm" id="btnXacNhan">
                        <i class="fas fa-check-circle"></i> Xác nhận nhập
                    </button>
                </div>
            </div>
        </div>

        <!-- Chi tiết sản phẩm -->
        <h4 class="mb-3 text-secondary fw-bold">Danh sách sản phẩm</h4>
        <table class="table table-bordered align-middle text-center">
            <thead class="table-light">
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Số lượng</th>
                    <th>Giá nhập</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ct, iStat : ${chiTietList}">
                    <input type="hidden" name="ct_id" th:value="${ct.id}" />
                    <td th:text="${ct.sanpham.MASP}"></td>
                    <td th:text="${ct.sanpham.TENSP}"></td>
                    <td>
                        <input type="number" class="form-control text-center" name="soluong"
                               th:value="${ct.soluong}" min="1" />
                    </td>
                    <td>
                        <input type="number" class="form-control" name="gianhap" th:value="${ct.gianhap}" min="0" step="1000" />
                    </td>
                    <td th:text="${#numbers.formatDecimal(ct.soluong * ct.gianhap, 0, 'POINT', 0, 'COMMA')}"></td>
                </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/phieunhap}" class="btn btn-secondary">
                ← Quay lại
            </a>
            <button type="submit" class="btn btn-success">
                Lưu thay đổi
            </button>
        </div>
    </form>

    <!-- FontAwesome + JS xử lý -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    
    <script>

        // Khi nhấn nút xác nhận -> set trạng thái = 1 và submit form
        document.getElementById('btnXacNhan').addEventListener('click', () => {
            document.getElementById('trangthai').value = 1;
            document.getElementById('phieunhapForm').submit();
        });
    </script>
</body>
</html>
