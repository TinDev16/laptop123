<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết phiếu nhập</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('nhap-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Chi tiết phiếu nhập', 'Kho / Nhập NVL')}"></div>
<main class="content-body detail-page"><div class="page-header"><div><h1 class="page-title" th:text="${'Phiếu nhập #' + receipt.maphieu}"></h1><p class="page-description">Thông tin nhà cung cấp và chi tiết nguyên vật liệu nhập kho.</p></div><a class="btn btn-back" th:href="@{/kho/nhap-nvl}"><i class="fas fa-arrow-left"></i> Về danh sách</a></div>
<p th:if="${success}" th:text="${success}" class="alert alert-success"></p><p th:if="${error}" th:text="${error}" class="alert alert-danger"></p>
<div class="content-card"><div class="content-card-body"><div class="detail-meta"><span th:text="${'Nhà cung cấp: ' + receipt.tenncc}"></span><span th:text="${'Người lập: ' + receipt.hoten}"></span><span><strong>Trạng thái:</strong> <span class="status-pill" th:text="${receipt.trangthai}"></span></span></div><p th:if="${receipt.ghichu != null}" th:text="${receipt.ghichu}"></p>
<form th:if="${receipt.trangthai == 'NHAP_NHAP'}" th:action="@{/kho/nhap-nvl/{id}/confirm(id=${receipt.maphieu})}" method="post" onsubmit="return confirm('Xác nhận nhập kho?')"><button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> Xác nhận nhập kho</button></form></div></div>
<div class="content-card"><div class="table-container"><table class="table"><thead><tr><th>Mã NVL</th><th>Tên NVL</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.manvl_code}"></td><td th:text="${l.tennvl}"></td><td data-number th:text="${l.soluong}"></td><td data-number th:text="${l.dongia}"></td><td data-number th:text="${l.thanhtien}"></td></tr></tbody></table></div></div>
</main></div></div></body></html>
