<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .table-container {
            width: 100%;
            overflow-x: auto;
        }
        .table {
            min-width: 1200px; /* Đảm bảo đủ cho tất cả cột */
            width: 100%;
            border-collapse: collapse;
        }
        .table th, .table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.98rem;
            white-space: nowrap; /* Không xuống dòng */
        }
        @media (max-width: 900px) {
            .table th, .table td {
                padding: 8px 4px;
                font-size: 0.92rem;
            }
            .table {
                min-width: 900px;
            }
        }
        @media (max-width: 700px) {
            .table {
                min-width: 700px;
            }
        }

    .bg-red-100 {
        background-color: #ffe5e5;
    }
    .modal {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4);
    }
    .modal-content {
        background: white; padding: 20px; border-radius: 10px;
        width: 400px;
    }
    .hidden { display: none; }

        /* Xóa gạch chân cho tất cả link trong nav */
    .nav a {
        text-decoration: none;
        color: inherit; /* Giữ nguyên màu gốc */
    }

    /* Tùy chỉnh khi rê chuột (hover) */
    .nav a:hover {
        text-decoration: none;
        color: #007bff; /* Hoặc màu bạn muốn khi hover */
    }

    /* Nếu muốn tab đang chọn nổi bật hơn */
    .nav-tab.active {
        color: #007bff;
        font-weight: 600;
    }

    /* ===== BẢNG TỒN KHO ===== */
.table-container {
    width: 100%;
    overflow-x: auto;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    margin-top: 20px;
}

.table {
    width: 100%;
    min-width: 1100px;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
    font-family: "Segoe UI", sans-serif;
}

.table th, .table td {
    padding: 12px 14px;
    text-align: left;
    font-size: 0.95rem;
    border-bottom: 1px solid #e0e0e0;
    white-space: nowrap;
}

.table th {
    text-transform: uppercase;
    letter-spacing: 0.4px;
}

.table tbody tr:hover {
    background-color: #f4f8ff;
    transition: background-color 0.2s ease-in-out;
}

.table tbody tr:last-child td {
    border-bottom: none;
}

/* Cột hình ảnh */
.table td img {
    width: 60px;
    height: auto;
    border-radius: 6px;
    object-fit: cover;
    box-shadow: 0 0 3px rgba(0,0,0,0.15);
}

/* Trạng thái */
.table td:last-child {
    font-weight: 500;
}

.table td:last-child:contains("Mở bán") {
    color: #28a745;
}

.table td:last-child:contains("Đóng") {
    color: #dc3545;
}

/* Responsive */
@media (max-width: 900px) {
    .table {
        font-size: 0.9rem;
    }
    .table th, .table td {
        padding: 10px 8px;
    }
}

@media (max-width: 700px) {
    .table {
        min-width: 700px;
    }
}


</style>
</head>

<body>
<!-- Header -->
<header class="header">
    <div class="header-content">
        <div class="header-left">
            <i class="fas fa-laptop"></i>
            <h1 class="header-title">Quản lý Cửa hàng Laptop</h1>
        </div>
        <div id="admin-auth" style="display: flex; align-items: center; gap: 1rem;">
            <!-- Nếu user đã login -->
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="btn btn-danger">
                        <i class="fas fa-sign-out-alt"></i> Đăng xuất
                    </button>
                </form>
            </div>

        </div>
    </div>
</header>

<!-- Navigation -->
<nav class="nav">
    <div class="nav-content">
        <a class="nav-tab active" data-tab="products" href="/">
            <i class="fas fa-home"></i>
            <span>Trang chủ</span>
        </a>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN')">
            <a class="nav-tab" data-tab="add-admin" href="/sanpham">
                <i class="fas fa-user-shield"></i>
                <span>Sản phẩm</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN','NV_nhap_xuat')">
            <a class="nav-tab" data-tab="add-admin" href="/phieunhap">
                <i class="fas fa-user-shield"></i>
                <span>phiếu nhập</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN','NV_nhap_xuat')">
            <a class="nav-tab" data-tab="add-admin" href="/phieuxuat">
                <i class="fas fa-user-shield"></i>
                <span>phiếu xuất</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN')">
            <a class="nav-tab" data-tab="add-admin" href="/khachhang">
                <i class="fas fa-user-shield"></i>
                <span>Khách hàng</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN')">
            <a class="nav-tab" data-tab="add-admin" href="/ncc">
                <i class="fas fa-user-shield"></i>
                <span>Nhà cung cấp</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN')">
            <a class="nav-tab" data-tab="add-admin" href="/nhanvien">
                <i class="fas fa-user-shield"></i>
                <span>Nhân viên</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN','NV_nhap_xuat')">
            <a class="nav-tab" data-tab="add-admin" href="/tonkho">
                <i class="fas fa-user-shield"></i>
                <span>Tồn kho</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAnyAuthority('QLy','ADMIN')">
            <a class="nav-tab" data-tab="add-admin" href="/thuonghieu">
                <i class="fas fa-user-shield"></i>
                <span>Thương hiệu</span>
            </a>
        </div>

        <div sec:authorize="isAuthenticated() and hasAuthority('ADMIN')">
            <a class="nav-tab" data-tab="add-admin" href="/quanlytaikhoan">
                <i class="fas fa-user-shield"></i>
                <span>Tài khoản</span>
            </a>
        </div>



    </div>
</nav>
<!-- Main Content -->
<main class="main">
    <!-- Products Tab -->
    <div id="products" class="tab-content active">
        <div class="page-header">
            <h2 class="page-title">Kho sản phẩm</h2>
            <div class="page-actions">
                <a href="#" class="btn btn-success" onclick="exportExcel()">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm sản phẩm..." onkeyup="filterProducts()">
            </div>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Hình ảnh</th>
                    <th>Xuất xứ</th>
                    <th>Chip</th>
                    <th>Hệ điều hành</th>   
                    <th>Thương hiệu</th>
                    <th>Số lượng tồn</th>
                    <th>Trạng thái</th>
                </tr>
                </thead>
                <tbody id="products-table">
                    <tr th:each="tk : ${tonkho}"
                        th:if ="${tk.TRANGTHAI == 0}">
                        <td class="font-semibold" th:text="${tk.MASP}"></td>
                        <td th:text="${tk.TENSP}"></td>
                        <td>
                            <img th:src="@{'/uploads/' + ${tk.HINHANHSP}}" alt="Ảnh sản phẩm" style="width:60px; border-radius:6px;">
                        </td>
                        <td th:text="${tk.XUATXU}"></td>
                        <td th:text="${tk.CHIP}"></td>
                        <td th:text="${tk.HEDIEUHANH}"></td>
                        <td th:text="${tk.thuonghieu != null ? tk.thuonghieu.TENTHUONGHIEU : 'Không có'}"></td>
                        <td th:text="${tk.SOLUONGTON}"></td>
                        <td th:text="${tk.TRANGTHAI == 0 ? 'Mở bán' : 'Đóng'}"></td>
                    </tr>
                </tbody>

            </table>
        </div>
    </div>
</main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
    function filterProducts() {
        const searchValue = document.getElementById('product-search').value.toLowerCase();
        const rows = document.querySelectorAll('#products-table tr');
        let visibleCount = 0;
    
        rows.forEach(row => {
            // Lấy dữ liệu từng cột (theo thứ tự bảng của bạn)
            const maSP = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';
            const tenSP = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
            const xuatXu = row.querySelector('td:nth-child(4)')?.textContent.toLowerCase() || '';
            const chip = row.querySelector('td:nth-child(5)')?.textContent.toLowerCase() || '';
            const heDieuHanh = row.querySelector('td:nth-child(6)')?.textContent.toLowerCase() || '';
            const thuongHieu = row.querySelector('td:nth-child(7)')?.textContent.toLowerCase() || '';
    
            // Nếu khớp bất kỳ thông tin nào trong 6 trường này thì hiển thị
            const isMatch =
                maSP.includes(searchValue) ||
                tenSP.includes(searchValue) ||
                xuatXu.includes(searchValue) ||
                chip.includes(searchValue) ||
                heDieuHanh.includes(searchValue) ||
                thuongHieu.includes(searchValue);
    
            row.style.display = isMatch ? '' : 'none';
            if (isMatch) visibleCount++;
        });
    
        // Hiển thị dòng "Không có kết quả"
        let noResultRow = document.getElementById('no-result-row');
        if (!noResultRow) {
            noResultRow = document.createElement('tr');
            noResultRow.id = 'no-result-row';
            noResultRow.innerHTML = `
                <td colspan="9" style="text-align:center; color:#dc3545; font-weight:500;">
                    Không có sản phẩm phù hợp
                </td>`;
            document.getElementById('products-table').appendChild(noResultRow);
        }
        noResultRow.style.display = (visibleCount === 0) ? '' : 'none';
    }
    
    // ✅ Xuất Excel (bỏ hình ảnh, chỉ xuất text)
    function exportExcel() {
        const table = document.querySelector('.table');
        // Tạo bản sao của bảng, bỏ hình ảnh
        const clone = table.cloneNode(true);
        clone.querySelectorAll('img').forEach(img => img.remove());
    
        // Chuyển thành workbook và ghi file
        const wb = XLSX.utils.table_to_book(clone, { sheet: "TonKho" });
        XLSX.writeFile(wb, 'tonkho.xlsx');
    }
    </script>
    
</body>
</html>
