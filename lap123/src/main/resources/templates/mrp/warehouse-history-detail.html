<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Chi tiết lịch sử kho</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>


<body>

<div class="app-container">

    <div th:replace="~{fragments/sidebar :: sidebar('lich-su')}"></div>


    <div class="main-wrapper">

        <div th:replace="~{fragments/sidebar :: topbar('Chi tiết lịch sử kho', 'Kho / Lịch sử / Chi tiết')}"></div>


        <main class="content-body">

            <h1>
                Chi tiết chứng từ
                <span th:text="${documentId}">
                    -
                </span>
            </h1>


            <!-- =================================================
                 THÔNG TIN CHỨNG TỪ
                 ================================================= -->

            <div class="content-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Thông tin chứng từ
                    </h2>

                </div>


                <div style="padding:1rem;">

                    <p>
                        <strong>Mã chứng từ:</strong>

                        <span th:text="${documentId}">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Loại giao dịch:</strong>

                        <span th:text="${document.loai_giao_dich}">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Loại hàng:</strong>

                        <span th:text="${document.loai_hang}">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Người thực hiện:</strong>

                        <span th:text="${document.nguoithuchien}">
                            -
                        </span>
                    </p>


                    <p>
                        <strong>Thời gian:</strong>

                        <span th:text="${document.ngay_giao_dich}">
                            -
                        </span>
                    </p>

                </div>

            </div>


            <!-- =================================================
                 CHI TIẾT CÁC DÒNG HÀNG
                 ================================================= -->

            <div class="content-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Chi tiết hàng hóa
                    </h2>

                    <span class="record-count"
                          th:text="${#lists.size(rows) + ' dòng'}">
                        0 dòng
                    </span>

                </div>


                <div class="table-container">

                    <table>

                        <thead>

                        <tr>

                            <th>
                                Mã hàng
                            </th>

                            <th>
                                Tên hàng
                            </th>

                            <th>
                                Loại hàng
                            </th>

                            <th>
                                Số lượng
                            </th>

                            <th>
                                Đơn giá
                            </th>

                            <th>
                                Thành tiền
                            </th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="r : ${rows}">

                            <td th:text="${r.ma_hang}">
                                -
                            </td>


                            <td th:text="${r.tenhang}">
                                -
                            </td>


                            <td th:text="${r.loai_hang}">
                                -
                            </td>


                            <td data-number
                                th:text="${r.so_luong}">
                                0
                            </td>


                            <td data-number
                                th:text="${r.dongia}">
                                0
                            </td>


                            <td data-number
                                th:text="${r.dongia != null ? r.dongia * r.so_luong : 0}">
                                0
                            </td>

                        </tr>


                        <tr class="empty-row"
                            th:if="${#lists.isEmpty(rows)}">

                            <td colspan="6">
                                Không có chi tiết.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <!-- =================================================
                 QUAY LẠI
                 ================================================= -->

            <div style="margin-top:1rem;">

                <a th:href="@{/kho/lich-su}"
                   class="btn">

                    <i class="fas fa-arrow-left"></i>

                    Quay lại lịch sử

                </a>

            </div>


        </main>

    </div>

</div>

</body>

</html>
