<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xuất thành phẩm</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('xuat-tp')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Xuất thành phẩm', 'Kho / Xuất thành phẩm')}"></div><main class="content-body">
<h1>Phiếu xuất thành phẩm</h1><p th:unless="${manager}"><a th:href="@{/kho/xuat-thanh-pham/create}" class="btn btn-primary">Lập đề nghị</a></p>
<div class="content-card"><div class="content-card-header"><h2 class="content-card-title">Phiếu xuất thành phẩm</h2><span class="record-count" th:text="${#lists.size(issues) + ' bản ghi'}">0 bản ghi</span></div><div class="table-container"><table><thead><tr><th>Mã</th><th>Sản phẩm</th><th>Số lượng</th><th>Người lập</th><th>Ngày</th><th>Trạng thái</th><th></th></tr></thead><tbody>
<tr th:each="i : ${issues}"><td th:text="${i.maphieu}"></td><td th:text="${i.tensp}"></td><td th:text="${i.soluong}"></td><td th:text="${i.hoten}"></td><td th:text="${i.ngaytao}"></td><td th:text="${i.trangthai}"></td><td><a th:href="@{/kho/xuat-thanh-pham/{id}(id=${i.maphieu})}">Xem</a></td></tr>
<tr class="empty-row" th:if="${#lists.isEmpty(issues)}"><td colspan="7">Chưa có dữ liệu để hiển thị.</td></tr></tbody></table></div></div></main></div></div></body></html>
