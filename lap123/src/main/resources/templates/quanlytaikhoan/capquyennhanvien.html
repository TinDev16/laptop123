<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<style>
    .bg-red-100 {
    background-color: #ffe5e5;
}
.modal {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4);
}
.modal-content {
    background: white; padding: 20px; border-radius: 10px;
    width: 400px;
}
.hidden { display: none; }

    .bg-red-100 {
        background-color: #ffe5e5;
    }

    .table-container h3 {
        color: #333;
        font-weight: 600;
    }
        /* Xóa gạch chân cho tất cả link trong nav */
        .nav a {
        text-decoration: none;
        color: inherit; /* Giữ nguyên màu gốc */
    }

    /* Tùy chỉnh khi rê chuột (hover) */
    .nav a:hover {
        text-decoration: none;
        color: #007bff;
    }

    .nav-tab.active {
        color: #007bff;
        font-weight: 600;
    }

</style>
<body>
<div class="app-container">
    <!-- SIDEBAR BÊN TRÁI -->
    <div th:replace="~{fragments/sidebar :: sidebar('taikhoan')}"></div>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Cấp Quyền Tài Khoản Nhân Viên', 'Tài khoản / Cấp quyền')}"></div>

        <main class="content-body" style="position: relative;">

    <a href="/quanlytaikhoan"
       style="position:absolute;
              top:125px;
              left:22px;
              background-color:#6c757d;
              color:white;
              border:none;
              padding:8px 10px;
              border-radius:50%;
              text-decoration:none;
              font-size:16px;
              display:flex;
              justify-content:center;
              align-items:center;
              width:36px;
              height:36px;
              box-shadow:0 2px 5px rgba(0,0,0,0.2);
              transition:background-color 0.3s, transform 0.2s;">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div id="products" class="tab-content active" style="margin-top: 35px;">
        <div class="page-header">
            <h2 class="page-title">Cấp Quyền Nhân viên</h2>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm nhân viên..." onkeyup="filterProducts()">
            </div>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã NV</th>
                    <th>Họ tên</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Số điện thoại</th>
                    <th>Ngày tham gia</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <!-- Duyệt danh sách nhân viên chưa có tài khoản -->
                <tr th:each="nv : ${listNv}">
                    <td th:text="${nv.MANV}"></td>
                    <td th:text="${nv.HOTEN}"></td>
                    <td th:text="${nv.GIOITINH}"></td>
                    <td th:text="${nv.NGAYSINH != null ? #dates.format(nv.NGAYSINH, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${nv.SDT}"></td>
                    <td th:text="${nv.NGAYTHAMGIA != null ? #dates.format(nv.NGAYTHAMGIA, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${nv.TRANGTHAI == 0 ? 'Hoạt động' : 'Nghỉ việc'}"></td>
                    <td>
                        <form th:action="@{/quanlytaikhoan/luucapquyen}" method="post">
                            <!-- Gửi cả 2 id: nhân viên và tài khoản -->
                            <input type="hidden" name="nhanvienId" th:value="${nv.MANV}" />
                            <input type="hidden" name="taikhoanId" th:value="${taikhoanId}" />
                            <button type="submit" class="btn btn-success">Cấp quyền</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        </main>
    </div>
</div>


<script>
    function filterProducts() {
        const input = document.getElementById("product-search");
        const filter = input.value.toLowerCase();
        const rows = document.querySelectorAll(".table tbody tr");

        rows.forEach(row => {
            const nameCell = row.querySelector("td:nth-child(2)"); // cột họ tên
            const name = nameCell.textContent.toLowerCase();
            row.style.display = name.includes(filter) ? "" : "none";
        });
    }
</script>
</body>
</html>
