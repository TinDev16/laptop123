<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Chi tiết phiếu nhập #' + ${phieunhap.maphieunhap}"></title>
    <meta name="description" th:content="'Thông tin chi tiết phiếu nhập ' + ${phieunhap.maphieunhap} + ' bao gồm sản phẩm, số lượng và giá nhập.'">
    <link rel="stylesheet" href="/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">

<main class="container mx-auto p-6">
    <!-- Breadcrumb -->
    <nav class="text-sm mb-4">
        <a href="/" class="text-blue-600 hover:underline">Trang chủ</a> /
        <a href="/phieunhap" class="text-blue-600 hover:underline">Phiếu nhập</a> /
        <span class="text-gray-500" th:text="'Chi tiết #' + ${phieunhap.maphieunhap}"></span>
    </nav>

    <!-- Header -->
    <header class="mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2" 
            th:text="'Phiếu nhập #' + ${phieunhap.maphieunhap}"></h1>
        <p class="text-gray-500">
            Ngày nhập: <span th:text="${#temporals.format(phieunhap.ngaynhap, 'dd/MM/yyyy')}"></span> |
            Nhân viên: <span th:text="${phieunhap.nhanvien?.tennv}"></span> |
            Nhà cung cấp: <span th:text="${phieunhap.nhacungcap?.tenncc}"></span>
        </p>
    </header>

    <!-- Thông tin phiếu nhập -->
    <section class="bg-white rounded-xl shadow p-5 mb-8">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Thông tin phiếu nhập</h2>
        <ul class="grid md:grid-cols-2 gap-4 text-gray-700">
            <li><b>Mã phiếu:</b> <span th:text="${phieunhap.maphieunhap}"></span></li>
            <li><b>Ngày nhập:</b> <span th:text="${#temporals.format(phieunhap.ngaynhap, 'dd/MM/yyyy')}"></span></li>
            <li><b>Tổng tiền:</b> 
                <span th:text="${#numbers.formatDecimal(phieunhap.tongtien, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
            </li>
            <li><b>Ghi chú:</b> <span th:text="${phieunhap.ghichu} ?: 'Không có'"></span></li>
        </ul>
    </section>

    <!-- Chi tiết sản phẩm -->
    <section class="bg-white rounded-xl shadow p-5">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Danh sách sản phẩm nhập</h2>
        <table class="w-full border-collapse text-sm">
            <thead>
                <tr class="bg-gray-100 text-gray-700 border-b">
                    <th class="p-3 text-left">#</th>
                    <th class="p-3 text-left">Sản phẩm</th>
                    <th class="p-3 text-center">Số lượng</th>
                    <th class="p-3 text-right">Giá nhập</th>
                    <th class="p-3 text-right">Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="ct, iter : ${ctList}" class="border-b hover:bg-gray-50">
                    <td class="p-3" th:text="${iter.index + 1}"></td>
                    <td class="p-3" th:text="${ct.sanpham.tensp}"></td>
                    <td class="p-3 text-center" th:text="${ct.soluong}"></td>
                    <td class="p-3 text-right" th:text="${#numbers.formatDecimal(ct.gianhap, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                    <td class="p-3 text-right" 
                        th:text="${#numbers.formatDecimal(ct.soluong * ct.gianhap, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                </tr>
            </tbody>
        </table>
    </section>

    <div class="mt-6 flex justify-end">
        <a th:href="@{/phieunhap}" class="btn bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">
            <i class="fa fa-arrow-left mr-2"></i>Quay lại
        </a>
    </div>
</main>

</body>
</html>
