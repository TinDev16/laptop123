<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý khách hàng</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('khachhang')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Quản lý Khách hàng', 'Đối tác / Khách hàng')}"></div>
<main class="content-body directory-page">
<div class="page-header"><div><h1 class="page-title">Khách hàng</h1><p class="page-description">Danh sách khách hàng đang hoạt động và thông tin liên hệ.</p></div><div class="page-actions"><a th:href="@{/khachhang/create}" class="btn btn-primary"><i class="fas fa-plus"></i> Thêm khách hàng</a><button type="button" class="btn btn-success" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Xuất Excel</button></div></div>
<div class="search-filters"><div class="search-input"><i class="fas fa-search"></i><input type="search" id="directory-search" placeholder="Tìm theo mã, họ tên hoặc số điện thoại" oninput="filterDirectory()"></div></div>
<div class="content-card"><div class="table-container"><table id="customer-table" class="table directory-table"><thead><tr><th>Mã KH</th><th>Họ tên</th><th>Giới tính</th><th>Ngày sinh</th><th>Số điện thoại</th><th>Ngày tham gia</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
<tbody><tr th:each="kh : ${khachhang}" th:if="${kh.TRANGTHAI == 0}"><td class="font-semibold" th:text="${kh.MAKH}"></td><td th:text="${kh.HOTEN}"></td><td th:text="${kh.GIOITINH}"></td><td th:text="${kh.NGAYSINH != null ? #dates.format(kh.NGAYSINH,'dd/MM/yyyy') : '—'}"></td><td th:text="${kh.SDT}"></td><td th:text="${kh.NGAYTHAMGIA != null ? #dates.format(kh.NGAYTHAMGIA,'dd/MM/yyyy') : '—'}"></td><td><span class="directory-status status-badge status-success"><i class="fas fa-circle"></i> Hoạt động</span></td><td><div class="table-actions"><a class="btn btn-icon btn-outline" title="Sửa khách hàng" th:href="@{/edit-khachhang/{id}(id=${kh.MAKH})}"><i class="fas fa-edit"></i></a></div></td></tr>
<tr class="empty-row" th:if="${#lists.isEmpty(khachhang)}"><td colspan="8">Chưa có khách hàng đang hoạt động.</td></tr><tr id="no-result-row" class="empty-row" hidden><td colspan="8">Không có khách hàng phù hợp.</td></tr></tbody></table></div></div>
</main></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script>
function filterDirectory(){const query=document.getElementById('directory-search').value.trim().toLowerCase();let visible=0;document.querySelectorAll('#customer-table tbody tr:not(.empty-row)').forEach(row=>{const match=row.textContent.toLowerCase().includes(query);row.hidden=!match;if(match)visible++});document.getElementById('no-result-row').hidden=visible!==0}
function exportExcel(){const book=XLSX.utils.book_new();const sheet=XLSX.utils.table_to_sheet(document.getElementById('customer-table'));XLSX.utils.book_append_sheet(book,sheet,'KhachHang');XLSX.writeFile(book,'khach-hang.xlsx')}
</script></body></html>
