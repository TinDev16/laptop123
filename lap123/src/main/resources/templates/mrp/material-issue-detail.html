<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Chi tiết xuất NVL</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('xuat-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Chi tiết đề nghị xuất NVL', 'Kho / Xuất NVL')}"></div><main class="content-body">
<h1 th:text="${'Phiếu xuất NVL #' + issue.maphieu}"></h1><p th:if="${success}" th:text="${success}" style="color:#15803d"></p><p th:if="${error}" th:text="${error}" style="color:#b91c1c"></p>
<p th:text="${'Yêu cầu #' + issue.mayeucau + ' · Sản phẩm: ' + issue.tensp + ' · Người lập: ' + issue.hoten}"></p><p th:text="${'Trạng thái: ' + issue.trangthai}"></p><p th:text="${issue.ghichu}"></p><p th:if="${issue.lydo != null}" th:text="${'Lý do từ chối: ' + issue.lydo}" style="color:#b91c1c"></p>
<div th:if="${manager and issue.trangthai == 'CHO_DUYET'}" style="display:flex;gap:1rem">
<form th:action="@{/kho/xuat-nvl/{id}/duyet(id=${issue.maphieu})}" method="post" onsubmit="return confirm('Duyệt và xuất NVL?')"><button type="submit" class="btn btn-primary">Duyệt và xuất</button></form>
<form th:action="@{/kho/xuat-nvl/{id}/tu-choi(id=${issue.maphieu})}" method="post" onsubmit="return confirm('Từ chối phiếu này?')"><input name="reason" required maxlength="255" placeholder="Lý do từ chối"><button type="submit">Từ chối</button></form></div>
<div class="content-card"><div class="table-container"><table><thead><tr><th>Mã NVL</th><th>Tên NVL</th><th>Số lượng</th><th>Đơn vị</th></tr></thead><tbody><tr th:each="l : ${lines}"><td th:text="${l.manvl_code}"></td><td th:text="${l.tennvl}"></td><td th:text="${l.soluong}"></td><td th:text="${l.donvitinh}"></td></tr></tbody></table></div></div>
<a th:href="@{/kho/xuat-nvl}">Về danh sách</a></main></div></div></body></html>
