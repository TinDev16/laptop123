<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ADMIN - Thông tin tài khoản</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin-layout.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --admin-bg: #f8fafc;
            --admin-surface: #ffffff;
            --admin-text: #0f172a;
            --admin-text-secondary: #64748b;
            --admin-primary: #2563eb;
            --admin-primary-hover: #1d4ed8;
            --admin-border: #e2e8f0;
            --admin-border-hover: #cbd5e1;
            --admin-radius: 14px;
            --admin-radius-sm: 9px;
            --admin-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            --admin-shadow-hover: 0 4px 12px rgba(15, 23, 42, 0.06);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: var(--admin-bg);
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--admin-bg);
            color: var(--admin-text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
            Roboto, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: var(--admin-primary);
            text-decoration: none;
            transition: color 0.18s ease;
        }

        a:hover {
            color: var(--admin-primary-hover);
        }

        .page {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 32px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            margin: 0 0 24px;
            color: var(--admin-text-secondary);
            font-size: 13px;
        }

        .breadcrumb a {
            color: var(--admin-text-secondary);
            font-weight: 500;
        }

        .breadcrumb a:hover {
            color: var(--admin-primary);
        }

        .breadcrumb .separator {
            color: #cbd5e1;
        }

        .breadcrumb .current {
            color: var(--admin-text);
            font-weight: 600;
        }

        .form-card {
            padding: 30px;
            background: var(--admin-surface);
            border: 1px solid var(--admin-border);
            border-radius: var(--admin-radius);
            box-shadow: var(--admin-shadow);
        }

        .form-card h1 {
            margin: 0 0 22px;
            color: var(--admin-text);
            font-size: 27px;
            font-weight: 750;
            line-height: 1.3;
            letter-spacing: -0.6px;
        }

        .note {
            position: relative;
            margin: 0 0 26px;
            padding: 14px 16px;
            color: #1e40af;
            background: #eff6ff;
            border: 1px solid #dbeafe;
            border-left: 4px solid #3b82f6;
            border-radius: var(--admin-radius-sm);
            font-size: 13px;
            line-height: 1.7;
        }

        .note i {
            margin-right: 6px;
        }

        form {
            width: 100%;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 21px;
        }

        .field label {
            color: #334155;
            font-size: 13px;
            font-weight: 650;
        }

        .required {
            color: #dc2626;
        }

        .field input,
        .field select {
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 44px;
            padding: 10px 13px;
            color: var(--admin-text);
            background-color: #fff;
            border: 1px solid var(--admin-border-hover);
            border-radius: var(--admin-radius-sm);
            outline: none;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.5;
            transition: border-color 0.18s ease,
            box-shadow 0.18s ease,
            background-color 0.18s ease;
        }

        .field input::placeholder {
            color: #94a3b8;
        }

        .field input:hover,
        .field select:hover {
            border-color: #94a3b8;
        }

        .field input:focus,
        .field select:focus {
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .field input:disabled,
        .field select:disabled {
            color: #94a3b8;
            background: #f1f5f9;
            cursor: not-allowed;
        }

        .field select {
            cursor: pointer;
        }

        .field-hint {
            margin: -2px 0 0;
            color: var(--admin-text-secondary);
            font-size: 12px;
        }

        .actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
            padding-top: 22px;
            border-top: 1px solid #f1f5f9;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: var(--admin-radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 650;
            line-height: 1.4;
            text-align: center;
            text-decoration: none;
            white-space: nowrap;
            transition: background-color 0.18s ease,
            border-color 0.18s ease,
            box-shadow 0.18s ease,
            transform 0.18s ease;
        }

        .btn:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.2);
            outline-offset: 2px;
        }

        .primary {
            color: #fff;
            background: var(--admin-primary);
            border-color: var(--admin-primary);
            box-shadow: 0 1px 2px rgba(37, 99, 235, 0.12);
        }

        .primary:hover {
            color: #fff;
            background: var(--admin-primary-hover);
            border-color: var(--admin-primary-hover);
            box-shadow: var(--admin-shadow-hover);
            transform: translateY(-1px);
        }

        .secondary {
            color: #334155;
            background: #fff;
            border-color: var(--admin-border-hover);
        }

        .secondary:hover {
            color: var(--admin-text);
            background: #f8fafc;
            border-color: #94a3b8;
        }

        @media (max-width: 768px) {
            .page {
                padding: 26px 20px 36px;
            }

            .form-card {
                padding: 24px;
            }

            .form-card h1 {
                font-size: 24px;
            }
        }

        @media (max-width: 480px) {
            .page {
                padding: 20px 14px 28px;
            }

            .breadcrumb {
                gap: 6px;
                margin-bottom: 18px;
                font-size: 12px;
            }

            .form-card {
                padding: 19px 16px;
                border-radius: 12px;
            }

            .form-card h1 {
                margin-bottom: 18px;
                font-size: 22px;
            }

            .note {
                padding: 12px;
                margin-bottom: 22px;
            }

            .field {
                margin-bottom: 18px;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
<div class="admin-layout">

    <!-- Sidebar ADMIN dùng chung -->
    <aside th:replace="~{fragments/admin-sidebar :: sidebar('taikhoan')}"></aside>

    <!-- Nội dung chính -->
    <main class="admin-main">
        <div class="page">

            <!-- Breadcrumb -->
            <p class="breadcrumb">
                <a th:href="@{/admin}">
                    <i class="fa-solid fa-house"></i>
                    Hệ thống
                </a>

                <span class="separator">/</span>

                <a th:href="@{/admin/taikhoan}">
                    Tài khoản
                </a>

                <span class="separator">/</span>

                <span class="current">Thông tin</span>
            </p>

            <!-- Form thêm / sửa tài khoản -->
            <section class="form-card">

                <h1 th:text="${isEdit} ? 'Chỉnh sửa tài khoản' : 'Thêm tài khoản'">
                    Thêm tài khoản
                </h1>

                <p class="note">
                    <i class="fa-solid fa-circle-info"></i>
                    Mật khẩu sẽ được mã hóa trước khi lưu.
                    Khi sửa tài khoản, để trống mật khẩu nếu không muốn
                    đổi mật khẩu hiện tại.
                </p>

                <form method="post" th:action="@{/admin/taikhoan/save}">

                    <!-- ID tài khoản khi chỉnh sửa -->
                    <input type="hidden"
                           name="id"
                           th:if="${isEdit}"
                           th:value="${taikhoan.taikhoan_id}">

                    <!-- Email -->
                    <div class="field">
                        <label for="email">
                            Email đăng nhập <span class="required">*</span>
                        </label>

                        <input id="email"
                               type="email"
                               name="email"
                               maxlength="255"
                               autocomplete="username"
                               placeholder="Nhập email đăng nhập"
                               required
                               th:value="${taikhoan.email}">
                    </div>

                    <!-- Mật khẩu -->
                    <div class="field">
                        <label for="password"
                               th:text="${isEdit}
                                   ? 'Mật khẩu mới (không bắt buộc)'
                                   : 'Mật khẩu *'">
                            Mật khẩu
                        </label>

                        <input id="password"
                               type="password"
                               name="password"
                               autocomplete="new-password"
                               placeholder="Nhập mật khẩu"
                               th:required="${!isEdit}"
                               minlength="6">

                        <p class="field-hint"
                           th:if="${isEdit}">
                            Chỉ nhập mật khẩu nếu muốn thay đổi mật khẩu hiện tại.
                        </p>

                        <p class="field-hint"
                           th:unless="${isEdit}">
                            Mật khẩu phải có ít nhất 6 ký tự.
                        </p>
                    </div>

                    <!-- Nhân viên -->
                    <div class="field">
                        <label for="manv">
                            Nhân viên <span class="required">*</span>
                        </label>

                        <select id="manv" name="manv" required>
                            <option value="">-- Chọn nhân viên --</option>

                            <option th:each="nv : ${danhSachNhanVien}"
                                    th:value="${nv.MANV}"
                                    th:selected="${taikhoan.nhanvien != null
                                        and taikhoan.nhanvien.MANV == nv.MANV}"
                                    th:text="${nv.HOTEN + ' (#' + nv.MANV + ')'}">
                            </option>
                        </select>
                    </div>

                    <!-- Vai trò -->
                    <div class="field">
                        <label for="vaitroId">
                            Vai trò <span class="required">*</span>
                        </label>

                        <select id="vaitroId" name="vaitroId" required>
                            <option value="">-- Chọn vai trò --</option>

                            <option th:each="v : ${danhSachVaiTro}"
                                    th:value="${v.vaitro_id}"
                                    th:selected="${taikhoan.vaitro != null
                                        and taikhoan.vaitro.vaitro_id == v.vaitro_id}"
                                    th:text="${v.ten != null ? v.ten : v.maVaitro}">
                            </option>
                        </select>
                    </div>

                    <!-- Nút thao tác -->
                    <div class="actions">
                        <button class="btn primary" type="submit">
                            <i class="fa-solid fa-floppy-disk"></i>
                            Lưu tài khoản
                        </button>

                        <a class="btn secondary"
                           th:href="@{/admin/taikhoan}">
                            <i class="fa-solid fa-arrow-left"></i>
                            Hủy
                        </a>
                    </div>

                </form>
            </section>

        </div>
    </main>
</div>
</body>
</html>
