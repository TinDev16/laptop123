<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xuất NVL</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('xuat-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Đề nghị xuất NVL', 'Kho / Xuất NVL')}"></div><main class="content-body">
<h1 th:text="${manager ? 'Phiếu đề nghị xuất NVL' : 'Phiếu xuất NVL của tôi'}"></h1><p th:unless="${manager}"><a th:href="@{/kho/xuat-nvl/create}" class="btn btn-primary">Lập đề nghị</a></p>
<div class="content-card"><div class="content-card-header"><h2 class="content-card-title">Phiếu xuất nguyên vật liệu</h2><span class="record-count" th:text="${#lists.size(issues) + ' bản ghi'}">0 bản ghi</span></div><div class="table-container"><table><thead><tr><th>Mã phiếu</th><th>Yêu cầu</th><th>Sản phẩm</th><th>Người lập</th><th>Ngày</th><th>Trạng thái</th><th></th></tr></thead><tbody>
<tr th:each="i : ${issues}"><td th:text="${i.maphieu}"></td><td th:text="${i.mayeucau}"></td><td th:text="${i.tensp}"></td><td th:text="${i.hoten}"></td><td th:text="${i.ngaytao}"></td><td><span th:text="${i.trangthai}" th:style="${i.trangthai == 'TU_CHOI' ? 'color:#b91c1c' : (i.trangthai == 'DA_XUAT' ? 'color:#15803d' : 'color:#a16207')}"></span></td><td><a th:href="@{/kho/xuat-nvl/{id}(id=${i.maphieu})}">Xem</a></td></tr>
<tr class="empty-row" th:if="${#lists.isEmpty(issues)}"><td colspan="7">Chưa có dữ liệu để hiển thị.</td></tr></tbody></table></div></div></main></div></div></body></html>
