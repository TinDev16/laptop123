<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đề nghị xuất thành phẩm</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('xuat-tp')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Lập đề nghị xuất thành phẩm', 'Kho / Xuất thành phẩm')}"></div>
<main class="content-body mrp-entry-page"><div class="page-header"><div><h1 class="page-title">Lập đề nghị xuất thành phẩm</h1><p class="page-description">Chọn sản phẩm và số lượng cần xuất từ kho.</p></div><a class="btn btn-outline" th:href="@{/kho/xuat-thanh-pham}">Về danh sách</a></div>
<div class="directory-alert directory-alert--error" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/kho/xuat-thanh-pham}" method="post" class="content-card ceo-form">
<div class="content-card-header"><h2 class="content-card-title">Thông tin đề nghị</h2></div>
<div class="content-card-body"><div class="ceo-form-grid">
<div class="ceo-field ceo-field-full"><label for="productId">Sản phẩm <span class="ceo-required">*</span></label><select id="productId" name="productId" class="form-control" required><option value="" disabled selected>Chọn sản phẩm</option><option th:each="p : ${products}" th:value="${p.masp}" th:text="${p.tensp + ' · Tồn: ' + p.soluongton}"></option></select><small>Tồn kho hiện tại được hiển thị cạnh tên sản phẩm.</small></div>
<div class="ceo-field"><label for="quantity">Số lượng xuất <span class="ceo-required">*</span></label><input id="quantity" name="quantity" type="number" min="1" required class="form-control" placeholder="Nhập số lượng"></div>
<div class="ceo-field ceo-field-full"><label for="issueNote">Lý do / ghi chú</label><textarea id="issueNote" name="note" maxlength="255" rows="3" class="form-control" placeholder="Ví dụ: xuất theo đơn hàng hoặc điều chuyển"></textarea></div>
</div><div class="ceo-form-actions"><button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(products)}">Gửi đề nghị</button></div></div></form>
</main></div></div></body></html>
