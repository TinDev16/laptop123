
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<aside th:fragment="sidebar(activeTab)" class="admin-sidebar">

    <!-- LOGO -->
    <a class="admin-brand" th:href="@{/admin}">
        <span class="admin-brand-icon">
            <i class="fas fa-laptop-code"></i>
        </span>
        <span>
            <strong>LAPTOP 123</strong>
            <small>ADMINISTRATION</small>
        </span>
    </a>

    <!-- THÔNG TIN ADMIN -->
    <div class="admin-user">
        <div class="admin-avatar">
            <i class="fas fa-user-shield"></i>
        </div>
        <div class="admin-user-info">
            <strong>Quản trị viên</strong>
            <span>ADMIN</span>
        </div>
    </div>

    <!-- MENU -->
    <nav class="admin-menu" aria-label="Menu quản trị">

        <div class="admin-menu-heading">NHÂN SỰ</div>

        <a th:href="@{/admin/nhanvien}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'nhanvien' ? ' active' : ''}">
            <i class="fas fa-users"></i>
            <span>Quản lý nhân viên</span>
        </a>

        <a th:href="@{/admin/taikhoan}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'taikhoan' ? ' active' : ''}">
            <i class="fas fa-user-lock"></i>
            <span>Quản lý tài khoản</span>
        </a>

        <a th:href="@{/admin/thong-tin-ca-nhan}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'thongtincanhan' ? ' active' : ''}">
            <i class="fas fa-id-card"></i>
            <span>Thông tin cá nhân</span>
        </a>

        <div class="admin-menu-heading">SẢN PHẨM & KHO</div>

        <a th:href="@{/admin/sanpham}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'sanpham' ? ' active' : ''}">
            <i class="fas fa-laptop"></i>
            <span>Quản lý sản phẩm</span>
        </a>

        <a th:href="@{/admin/loai-nvl}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'loai-nvl' ? ' active' : ''}">
            <i class="fas fa-layer-group"></i>
            <span>Loại nguyên vật liệu</span>
        </a>

        <a th:href="@{/admin/nguyen-vat-lieu}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'nvl' ? ' active' : ''}">
            <i class="fas fa-cubes"></i>
            <span>Nguyên vật liệu</span>
        </a>

        <div class="admin-menu-heading">ĐỐI TÁC</div>

        <a th:href="@{/admin/nha-cung-cap}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'ncc' ? ' active' : ''}">
            <i class="fas fa-building"></i>
            <span>Quản lý nhà cung cấp</span>
        </a>

        <a th:href="@{/admin/khach-hang}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'khachhang' ? ' active' : ''}">
            <i class="fas fa-user-group"></i>
            <span>Quản lý khách hàng</span>
        </a>

        <a th:href="@{/admin/thuong-hieu}"
           class="admin-menu-item"
           th:classappend="${activeTab == 'thuonghieu' ? ' active' : ''}">
            <i class="fas fa-tags"></i>
            <span>Quản lý thương hiệu</span>
        </a>

    </nav>

    <!-- ĐĂNG XUẤT -->
    <div class="admin-sidebar-footer">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="admin-logout">
                <i class="fas fa-right-from-bracket"></i>
                <span>Đăng xuất</span>
            </button>
        </form>
    </div>

</aside>
</html>
