<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa sản phẩm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            padding: 32px;
        }
        .form-container {
            max-width: 540px;
            margin: auto;
            background: #fff;
            padding: 32px 36px 24px 36px;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .form-container h1 {
            margin-bottom: 18px;
            text-align: center;
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #374151;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: #f9fafb;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4f46e5;
            outline: none;
        }
        .form-group .image-preview {
            margin-top: 8px;
            display: flex;
            justify-content: center;
        }
        .form-group .image-preview img {
            max-width: 180px;
            max-height: 120px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }
        .form-actions {
            margin-top: 28px;
            text-align: center;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin: 0 8px;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn-primary {
            background: #4f46e5;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        @media (max-width: 600px) {
            .form-container {
                padding: 18px 8px;
            }
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Sửa sản phẩm</h1>
    <form th:action="@{/update-sanpham}" th:object="${sanpham}" method="POST" enctype="multipart/form-data" autocomplete="off">
        <input type="hidden" th:field="*{MASP}">
    
        <div class="form-group">
            <label for="TENSP">Tên sản phẩm</label>
            <input type="text" id="TENSP" th:field="*{TENSP}" placeholder="Nhập tên sản phẩm" required>
        </div>
    
        <div class="form-group">
            <label for="productImage">Hình ảnh sản phẩm</label>
            <div id="currentImage" class="current-image-card"
                 th:if="${sanpham.HINHANHSP != null and !#strings.isEmpty(sanpham.HINHANHSP)}">
                <img th:src="@{/uploads/{file}(file=${sanpham.HINHANHSP})}"
                     th:alt="${'Ảnh hiện tại của ' + sanpham.TENSP}">
                <div>
                    <strong>Ảnh đang sử dụng</strong>
                    <p style="margin:.35rem 0 0;color:#64748b">Chọn ảnh mới bên dưới nếu cần thay thế. Để trống để giữ nguyên ảnh này.</p>
                </div>
            </div>
            <div id="imagePreview" class="image-preview" style="margin-top:10px;"></div>
            <input id="productImage" type="file" name="file" accept="image/*" onchange="previewImage(event)">
        </div>
    
        <div class="form-group">
            <label for="XUATXU">Xuất xứ</label>
            <input type="text" id="XUATXU" th:field="*{XUATXU}" placeholder="Xuất xứ sản phẩm">
        </div>

    
        <div class="form-group">
            <label for="HEDIEUHANH">Hệ điều hành</label>
            <select id="HEDIEUHANH" th:field="*{HEDIEUHANH}">
                <option value="Windows">Windows</option>
                <option value="Linux">Linux</option>
                <option value="macOS">macOS</option>
            </select>
        </div>

    
        <div class="form-group">
            <label>Thương hiệu</label>
            <select th:field="*{thuonghieu}" class="form-control" required>
                <option value="" disabled>-- Chọn thương hiệu --</option>
                <option th:each="th : ${thuonghieuList}"
                        th:if="${th.TRANGTHAI == 0}"
                        th:value="${th.MATHUONGHIEU}"
                        th:text="${th.TENTHUONGHIEU}">
                </option>
            </select>
        </div>
        
    
        <div class="form-group">
            <label for="TRANGTHAI">Trạng thái</label>
            <select id="TRANGTHAI" th:field="*{TRANGTHAI}">
                <option value="0">Mở bán</option>
                <option value="1">Ngừng bán</option>
            </select>
        </div>

        <div class="form-group">
            <label for="GHICHU">Ghi chú</label>
            <input type="text" id="GHICHU" th:field="*{GHICHU}">
        </div>
    
        <button type="submit" class="btn btn-primary">Cập nhật</button>
        <a th:href="@{/sanpham}" class="btn btn-secondary">Hủy</a>
    </form>
    
</div>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('imagePreview');
        preview.innerHTML = '';
        const currentImage = document.getElementById('currentImage');

        if (input.files && input.files[0]) {
            const file = input.files[0];
            if (file.size > 25 * 1024 * 1024) {
                alert('Dung lượng tệp quá lớn (' + (file.size / (1024 * 1024)).toFixed(1) + 'MB). Vui lòng chọn ảnh có kích thước dưới 25MB.');
                input.value = '';
                if (currentImage) currentImage.style.display = 'flex';
                return;
            }

            if (currentImage) currentImage.style.display = 'none';

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.alt = "Xem trước hình ảnh";
                img.style.maxWidth = "200px";
                img.style.height = "auto";
                preview.appendChild(img);
            };
            reader.readAsDataURL(file);
        }
    }
</script>
</body>
</html>
