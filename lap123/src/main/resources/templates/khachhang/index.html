<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<style>
    .bg-red-100 {
    background-color: #ffe5e5;
    }
    .modal {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4);
    }
    .modal-content {
        background: white; padding: 20px; border-radius: 10px;
        width: 400px;
    }
    .hidden { display: none; }

    .bg-red-100 {
        background-color: #ffe5e5;
    }

    .table-container h3 {
        color: #333;
        font-weight: 600;
    }

    /* Xóa gạch chân cho tất cả link trong nav */
    .nav a {
        text-decoration: none;
        color: inherit; /* Giữ nguyên màu gốc */
    }

    /* Tùy chỉnh khi rê chuột (hover) */
    .nav a:hover {
        text-decoration: none;
        color: #007bff;
    }

    .nav-tab.active {
        color: #007bff;
        font-weight: 600;
    }

</style>
<body>
<div class="app-container">
    <!-- SIDEBAR BÊN TRÁI -->
    <div th:replace="~{fragments/sidebar :: sidebar('khachhang')}"></div>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Quản Lý Khách Hàng', 'Danh mục / Khách hàng')}"></div>

        <main class="content-body">
            <div id="products" class="tab-content active" style="display: block;">
        <div class="page-header">
            <h2 class="page-title">Quản lý Khách hàng</h2>
            <div class="page-actions">
                <a th:href="@{/khachhang/create}" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Thêm khách hàng
                </a>
                <a href="#" class="btn btn-success" onclick="exportExcel('products')">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm khách hàng..." onkeyup="filterProducts()">
            </div>
        </div>
        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã KH</th>
                    <th>Họ tên</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Số điện thoại</th>
                    <th>Ngày tham gia</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="employees-table">
                <tr th:each="kh : ${khachhang}"
                    th:if="${kh.TRANGTHAI == 0}">
                    <td class="font-semibold" th:text="${kh.MAKH}"></td>
                    <td th:text="${kh.HOTEN}"></td>
                    <td th:text="${kh.GIOITINH}"></td>
                    <td th:text="${kh.NGAYSINH != null ? #dates.format(kh.NGAYSINH, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${kh.SDT}"></td>
                    <td th:text="${kh.NGAYTHAMGIA != null ? #dates.format(kh.NGAYTHAMGIA, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${kh.TRANGTHAI == 0 ? 'Hoạt động' : 'Ngừng hoạt động'}"></td>
                    <td>
                        <div class="table-actions">
                            <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-khachhang/{id}(id=${kh.MAKH})}">
                                <i class="fas fa-edit"></i>
                            </a>
                            <button
                                type="button"
                                class="btn btn-danger"
                                th:attr="data-id=${kh.MAKH}, data-ten=${kh.HOTEN}"
                                onclick="showDeleteModal(this)">
                                Xóa
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <br><br><br>
            <h1 style="margin: 20px 0 10px;">Khách hàng ngừng hoạt động</h1>
            <table class="table bg-red-100">
                <thead>
                <tr>
                    <th>Mã KH</th>
                    <th>Họ tên</th>
                    <th>Giới tính</th>
                    <th>Ngày sinh</th>
                    <th>Số điện thoại</th>
                    <th>Ngày tham gia</th>
                    <th>Trạng thái</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="employees-table">
                <tr th:each="kh : ${khachhang}"
                    th:if="${kh.TRANGTHAI == 1}">
                    <td class="font-semibold" th:text="${kh.MAKH}"></td>
                    <td th:text="${kh.HOTEN}"></td>
                    <td th:text="${kh.GIOITINH}"></td>
                    <td th:text="${kh.NGAYSINH != null ? #dates.format(kh.NGAYSINH, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${kh.SDT}"></td>
                    <td th:text="${kh.NGAYTHAMGIA != null ? #dates.format(kh.NGAYTHAMGIA, 'dd/MM/yyyy') : ''}"></td>
                    <td th:text="${kh.TRANGTHAI == 0 ? 'Hoạt động' : 'Ngừng hoạt động'}"></td>
                    <td th:text="${kh.GHICHU != null ? kh.GHICHU : ''}"></td>
                    <td>
                        <div class="table-actions">
                            <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-khachhang/{id}(id=${kh.MAKH})}">
                                <i class="fas fa-edit"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        </main>
    </div>
</div>
<!-- Modal xác nhận xóa -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3>Xóa khách hàng</h3>
        <p id="deleteMessage"></p>
        <form th:action="@{/delete-khachhang}" method="POST">
            <input type="hidden" id="deleteId" name="id">
            <textarea name="GHICHU" placeholder="Nhập lý do xóa..." required></textarea>
            <div class="modal-actions">
                <button type="submit" class="btn btn-danger">Xác nhận</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
    function showDeleteModal(button) {
        const id = button.getAttribute('data-id');
        const ten = button.getAttribute('data-ten');

        // Gán giá trị vào modal
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteMessage").textContent = `Bạn có chắc chắn muốn xóa khách hàng "${ten}" không?`;

        // Hiện modal
        document.getElementById("deleteModal").classList.remove("hidden");
    }

    function closeModal() {
        document.getElementById("deleteModal").classList.add("hidden");
    }
</script>

<!-- Thêm thư viện SheetJS để xuất Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// ================= 🔍 TÌM KIẾM KHÁCH HÀNG =================
function filterProducts() {
    const searchInput = document.getElementById('product-search').value.toLowerCase();

    // Lấy tất cả các dòng trong cả 2 bảng
    const rows = document.querySelectorAll('.table tbody tr');
    let visibleCount = 0;

    rows.forEach(row => {
        const hoTen = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
        const sdt = row.querySelector('td:nth-child(5)')?.textContent.toLowerCase() || '';
        const maKH = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';

        const match = (
            hoTen.includes(searchInput) ||
            sdt.includes(searchInput) ||
            maKH.includes(searchInput)
        );

        row.style.display = match ? '' : 'none';
        if (match) visibleCount++;
    });

    let noResultRow = document.getElementById('no-result-row');
    if (!noResultRow) {
        noResultRow = document.createElement('tr');
        noResultRow.id = 'no-result-row';
        noResultRow.innerHTML = `<td colspan="9" style="text-align:center;color:#dc3545;font-weight:500;">Không có khách hàng phù hợp</td>`;
        document.querySelector('.table tbody').appendChild(noResultRow);
    }
    noResultRow.style.display = (visibleCount === 0) ? '' : 'none';
}

// ================= 📤 XUẤT EXCEL CẢ 2 BẢNG =================
function exportExcel() {
    const tables = document.querySelectorAll('.table');
    if (tables.length === 0) {
        alert("Không tìm thấy bảng khách hàng!");
        return;
    }

    const wb = XLSX.utils.book_new();

    tables.forEach((table, index) => {
        const sheetName = index === 0 ? "KhachHang_HoatDong" : "KhachHang_NgungHoatDong";
        const ws = XLSX.utils.table_to_sheet(table);
        XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    XLSX.writeFile(wb, 'khachhang.xlsx');
}
</script>

</body>
</html>
