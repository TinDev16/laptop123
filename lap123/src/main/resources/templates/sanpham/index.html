<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<style>
    .bg-red-100 {
    background-color: #ffe5e5;
}
.modal {
    position: fixed; inset: 0; display: flex;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4);
}
.modal-content {
    background: white; padding: 20px; border-radius: 10px;
    width: 400px;
}
.hidden { display: none; }
</style>
<body>
<!-- Header -->
<header class="header">
    <div class="header-content">
        <div class="header-left">
            <i class="fas fa-laptop"></i>
            <h1 class="header-title">Quản lý Cửa hàng Laptop</h1>
        </div>
        <!-- Đặt nút đăng nhập/đăng xuất admin ở bên trái, gần ngày -->
        <div class="header-right">
            <div id="admin-auth">
                <button id="logout-btn" class="btn btn-danger">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
        </div>
    </div>
</header>

<!-- Navigation -->
<nav class="nav">
    <div class="nav-content">
        <a class="nav-tab" data-tab="products" href="/">
            <i class="fas fa-home"></i>
            <span>Trang chủ</span>
        </a>

        <a class="nav-tab active" data-tab="products" href="/sanpham">
            <i class="fas fa-box"></i>
            <span>Sản phẩm</span>
        </a>

        <a class="nav-tab" data-tab="import-slips" href="/phieunhap">
            <i class="fas fa-arrow-down"></i>
            <span>Phiếu nhập</span>
        </a>

        <a class="nav-tab" data-tab="export-slips" href="/phieuxuat">
            <i class="fas fa-arrow-up"></i>
            <span>Phiếu xuất</span>
        </a>

        <a class="nav-tab" data-tab="customers" href="/khachhang">
            <i class="fas fa-users"></i>
            <span>Khách hàng</span>
        </a>

        <a class="nav-tab" data-tab="suppliers" href="/ncc">
            <i class="fas fa-building"></i>
            <span>Nhà cung cấp</span>
        </a>

        <a class="nav-tab" data-tab="employees" href="/nhanvien">
            <i class="fas fa-user-tie"></i>
            <span>Nhân viên</span>
        </a>

        <a class="nav-tab" data-tab="inventory" href="/tonkho">
                <i class="fas fa-warehouse"></i>
        <span>Tồn kho</span>
        </a>

        <a class="nav-tab" data-tab="brands" href="/thuonghieu">
            <i class="fas fa-tags"></i>
            <span>Thương hiệu</span>
        </a>
    </div>
</nav>
<!-- Main Content -->
<main class="main">
    <!-- Products Tab -->
    <div id="products" class="tab-content active">
        <div class="page-header">
            <h2 class="page-title">Quản lý Sản phẩm</h2>
            <div class="page-actions">
                <a th:href="@{/sanpham/create}" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Thêm sản phẩm
                </a>
                <a href="#" class="btn btn-success" onclick="exportExcel('products')">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm sản phẩm..." onkeyup="filterProducts()">
            </div>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Hệ điều hành</th>
                    <th>Thương hiệu</th>
                    <th>Trạng thái</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="products-table">
                    <tr th:each="sp : ${sanpham}"
                        th:classappend="${sp.TRANGTHAI == 1} ? 'bg-red-100 text-gray-700' : ''">
                        <td th:text="${sp.MASP}"></td>
                        <td th:text="${sp.TENSP}"></td>
                        <td th:text="${sp.HEDIEUHANH}"></td>
                        <td th:text="${sp.thuonghieu != null ? sp.thuonghieu.TENTHUONGHIEU : 'Không có'}"></td>
                        <td th:text="${sp.TRANGTHAI == 0 ? 'Mở bán' : 'Ngừng bán'}"></td>
                        <td th:text="${sp.GHICHU != null ? sp.GHICHU : ''}"></td>
                        <td>
                            <div class="table-actions">
                                <a class="btn btn-icon btn-outline" th:href="@{/view/{id}(id=${sp.MASP})}" title="Xem chi tiết">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-sanpham/{id}(id=${sp.MASP})}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <!-- <a class="btn btn-icon btn-outline text-red-600" title="Xóa" th:href="@{/delete-sanpham/{id}(id=${sp.MASP})}">
                                    <i class="fas fa-trash"></i>
                                </a> -->

                                <button
                                        type="button"
                                        class="btn btn-danger"
                                        th:attr="data-id=${sp.MASP}, data-ten=${sp.TENSP}"
                                        onclick="showDeleteModal(this)">
                                    Xóa
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
    </div>

<!-- Modal xác nhận xóa -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3>Xóa sản phẩm</h3>
        <p id="deleteMessage"></p>
        <form th:action="@{/delete-sanpham}" method="POST">
            <input type="hidden" id="deleteId" name="id">
            <textarea name="GHICHU" placeholder="Nhập lý do xóa..." required></textarea>
            <div class="modal-actions">
                <button type="submit" class="btn btn-danger">Xác nhận</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
function showDeleteModal(button) {
    const id = button.getAttribute('data-id');
    const ten = button.getAttribute('data-ten');

    // Gán giá trị vào modal
    document.getElementById("deleteId").value = id;
    document.getElementById("deleteMessage").textContent = `Bạn có chắc chắn muốn xóa sản phẩm "${ten}" không?`;

    // Hiện modal
    document.getElementById("deleteModal").classList.remove("hidden");
}


function closeModal() {
    document.getElementById("deleteModal").classList.add("hidden");
}
</script>

<!-- Thêm thư viện SheetJS để xuất Excel -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
// filepath: e:\OOAD\lap123\src\main\resources\templates\sanpham\index.html
function filterProducts() {
    const searchInput = document.getElementById('product-search').value.toLowerCase();
    const rows = document.querySelectorAll('#products-table tr');
    let visibleCount = 0;

    rows.forEach(row => {
        const maSp = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';
        const tenSp = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
        const heDieuHanh = row.querySelector('td:nth-child(3)')?.textContent.toLowerCase() || '';
        const thuongHieu = row.querySelector('td:nth-child(4)')?.textContent.toLowerCase() || '';
        const trangThai = row.querySelector('td:nth-child(5)')?.textContent.toLowerCase() || '';
        let show = true;

        // Tìm kiếm theo tất cả trường
        if (searchInput && !(
            maSp.includes(searchInput) ||
            tenSp.includes(searchInput) ||
            heDieuHanh.includes(searchInput) ||
            thuongHieu.includes(searchInput) ||
            trangThai.includes(searchInput)
        )) {
            show = false;
        }
        row.style.display = show ? '' : 'none';
        if (show) visibleCount++;
    });

    let noResultRow = document.getElementById('no-result-row');
    if (!noResultRow) {
        noResultRow = document.createElement('tr');
        noResultRow.id = 'no-result-row';
        noResultRow.innerHTML = `<td colspan="7" style="text-align:center;color:#dc3545;font-weight:500;">Không có sản phẩm phù hợp</td>`;
        document.getElementById('products-table').appendChild(noResultRow);
    }
    noResultRow.style.display = (visibleCount === 0) ? '' : 'none';
}

// Xuất Excel toàn bộ bảng sản phẩm
function exportExcel() {
    const table = document.querySelector('.table');
    const wb = XLSX.utils.table_to_book(table, {sheet: "SanPham"});
    XLSX.writeFile(wb, 'sanpham.xlsx');
}
</script>

<!--<script src="script.js" type="text/javascript"></script>-->
</body>
</html>
