<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Nhân viên mới</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            padding: 32px;
        }
        .form-container {
            max-width: 540px;
            margin: auto;
            background: #fff;
            padding: 32px 36px 24px 36px;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .form-container h1 {
            margin-bottom: 18px;
            text-align: center;
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            font-weight: 600;
            display: block;
            margin-bottom: 6px;
            color: #374151;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: #f9fafb;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #4f46e5;
            outline: none;
        }
        .form-actions {
            margin-top: 28px;
            text-align: center;
        }
        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin: 0 8px;
            transition: background 0.2s;
        }
        .btn-primary {
            background: #4f46e5;
            color: #fff;
        }
        .btn-primary:hover {
            background: #4338ca;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: #374151;
        }
        .btn-secondary:hover {
            background: #d1d5db;
        }
        @media (max-width: 600px) {
            .form-container {
                padding: 18px 8px;
            }
        }
    </style>
</head>
<body>
<div class="form-container">
    <h1>Thêm Nhân viên</h1>
    <form th:action="@{/nhanvien}" th:object="${nhanvien}" method="POST" autocomplete="off">
        
        <div class="form-group">
            <label for="HOTEN">Tên nhân viên <span class="required">*</span></label>
            <input type="text"
                   id="HOTEN"
                   th:field="*{HOTEN}"
                   placeholder="Nhập tên nhân viên" required>
        </div>

        <div class="form-group">
            <label for="GIOITINH">Giới tính</label>
            <select id="GIOITINH" th:field="*{GIOITINH}" class="form-control">
                <option value="" disabled selected>-- Chọn giới tính --</option>
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
                <option value="Khác">Khác</option>
            </select>
        </div>

        <div class="form-group">
            <label for="NGAYSINH">Ngày sinh</label>
            <input type="date"
                   id="NGAYSINH"
                   th:field="*{NGAYSINH}">
        </div>

        <div class="form-group">
            <label for="SDT">Số điện thoại</label>
            <input type="text"
                   id="SDT"
                   th:field="*{SDT}"
                   placeholder="Nhập số điện thoại">
        </div>

        <div class="form-group">
            <label for="NGAYTHAMGIA">Ngày tham gia</label>
            <input type="date"
                   id="NGAYTHAMGIA"
                   th:field="*{NGAYTHAMGIA}">
        </div>

        <div class="form-group">
            <label for="TRANGTHAI">Trạng thái</label>
            <select id="TRANGTHAI" name="trangThai" th:field="*{TRANGTHAI}">
                <option value="0">Hoạt động</option>
                <option value="1">Nghỉ việc</option>
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Thêm nhân viên</button>
            <a th:href="@{/nhanvien}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
