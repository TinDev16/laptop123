<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Chi tiết xuất NVL</title>

    <link rel="stylesheet" th:href="@{/style.css}">
    <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
            rel="stylesheet">


    <style>
        .warehouse-error-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: rgba(15, 23, 42, 0.55);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .warehouse-error-content {
            width: 100%;
            max-width: 460px;
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: warehouseModalShow 0.2s ease-out;
        }

        .warehouse-error-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fef2f2;
            color: #dc2626;
            font-size: 28px;
        }

        .warehouse-error-content h3 {
            margin: 0 0 12px;
            color: #1e293b;
            font-size: 21px;
        }

        .warehouse-error-content p {
            margin: 0 0 24px;
            color: #475569;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }

        .warehouse-error-actions {
            display: flex;
            justify-content: center;
        }

        @keyframes warehouseModalShow {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('xuat-nvl')}"></div>

    <div class="main-wrapper">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Chi tiết đề nghị xuất NVL', 'Kho / Xuất NVL')}"></div>

        <main class="content-body">

            <!-- PAGE HEADER -->
            <div class="page-header">

                <div>
                    <h1
                            class="page-title"
                            th:text="${'Phiếu xuất NVL #' + issue.maphieu}">
                    </h1>

                    <p class="page-description">
                        Kiểm tra thông tin và số lượng vật tư trước khi phê duyệt.
                    </p>
                </div>

                <a
                        class="btn btn-back"
                        th:href="@{/kho/xuat-nvl}">
                    <i class="fas fa-arrow-left"></i>
                    Về danh sách
                </a>

            </div>


            <!-- ALERT SUCCESS -->
            <p
                    th:if="${success}"
                    th:text="${success}"
                    class="alert alert-success">
            </p>


            <!-- MODAL THÔNG BÁO LỖI -->
            <div
                    id="warehouse-error-modal"
                    class="warehouse-error-modal"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="warehouse-error-title">

                <div class="warehouse-error-content">

                    <div class="warehouse-error-icon">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>

                    <h3 id="warehouse-error-title">
                        Không đủ nguyên vật liệu
                    </h3>

                    <p id="warehouse-error-message"></p>

                    <div class="warehouse-error-actions">
                        <button
                                type="button"
                                id="close-warehouse-error"
                                class="btn btn-primary">
                            <i class="fas fa-check"></i>
                            Đã hiểu
                        </button>
                    </div>

                </div>
            </div>


            <div class="content-card">

                <div class="content-card-body">

                    <!-- ========================= -->
                    <!-- THÔNG TIN ĐỀ NGHỊ -->
                    <!-- ========================= -->

                    <h2 class="ceo-section-title">
                        <i class="fas fa-file-alt"></i>
                        Thông tin đề nghị
                    </h2>


                    <div class="detail-meta">

                        <span>
                            <strong>Yêu cầu sản xuất:</strong>
                            <a th:href="@{/san-xuat/yeu-cau/{id}(id=${issue.mayeucau})}"
                               th:text="${issue.tendot != null
                                   ? issue.tendot + ' (' + (issue.madot_code != null ? issue.madot_code : 'YCSX-' + issue.mayeucau) + ')'
                                   : 'Yêu cầu #' + issue.mayeucau}">
                            </a>
                        </span>

                        <span
                                th:text="${'Sản phẩm: ' + issue.tensp}">
                        </span>

                        <span>
                            <strong>BOM áp dụng:</strong>
                            <span th:text="${issue.tenbom}"></span>
                        </span>

                        <span
                                th:text="${'Người lập: ' + issue.hoten}">
                        </span>

                        <span>
                            <strong>Ngày lập:</strong>
                            <span data-date-time th:text="${issue.ngaylap}"></span>
                        </span>

                        <span>
                            <strong>Trạng thái:</strong>

                            <span
                                    class="status-pill"
                                    th:text="${issue.trangthai}">
                            </span>
                        </span>

                    </div>


                    <!-- GHI CHÚ -->
                    <p
                            th:if="${issue.ghichu != null and !#strings.isEmpty(issue.ghichu)}"
                            th:text="${issue.ghichu}">
                    </p>


                    <!-- LÝ DO TỪ CHỐI -->
                    <p
                            th:if="${issue.lydo != null}"
                            class="alert alert-danger"
                            th:text="${'Lý do từ chối: ' + issue.lydo}">
                    </p>


                    <!-- ========================= -->
                    <!-- KHU VỰC PHÊ DUYỆT -->
                    <!-- ========================= -->

                    <div
                            th:if="${manager and issue.trangthai == 'CHO_DUYET'}"
                            class="approval-panel">

                        <!-- DUYỆT -->
                        <form
                                class="approval-approve"
                                th:action="@{/kho/xuat-nvl/{id}/duyet(id=${issue.maphieu})}"
                                method="post"
                                onsubmit="return confirm('Duyệt và xuất nguyên vật liệu?')">

                            <button
                                    type="submit"
                                    class="btn btn-primary">

                                <i class="fas fa-check"></i>
                                Duyệt và xuất kho

                            </button>

                        </form>


                        <!-- TỪ CHỐI -->
                        <form
                                class="reject-form"
                                th:action="@{/kho/xuat-nvl/{id}/tu-choi(id=${issue.maphieu})}"
                                method="post"
                                onsubmit="return confirm('Xác nhận từ chối phiếu này?')">

                            <div class="ceo-field">

                                <label for="rejectReason">

                                    Lý do từ chối

                                    <span class="ceo-required">
                                        *
                                    </span>

                                </label>

                                <input
                                        id="rejectReason"
                                        name="reason"
                                        required
                                        maxlength="255"
                                        class="form-control"
                                        placeholder="Nhập lý do cụ thể để người lập xử lý">

                            </div>


                            <button
                                    type="submit"
                                    class="btn btn-reject">

                                <i class="fas fa-times"></i>
                                Từ chối

                            </button>

                        </form>

                    </div>


                    <!-- ========================= -->
                    <!-- DANH SÁCH VẬT TƯ -->
                    <!-- ========================= -->

                    <h2 class="ceo-section-title">
                        <i class="fas fa-cubes"></i>
                        Vật tư đề nghị xuất
                    </h2>


                    <div class="table-container">

                        <table class="table">

                            <thead>

                            <tr>

                                <th>Mã NVL</th>

                                <th>Tên NVL</th>

                                <th>Loại</th>

                                <th>Số lượng</th>

                                <th>Đơn vị</th>

                            </tr>

                            </thead>


                            <tbody>

                            <tr th:each="l : ${lines}">

                                <!-- MÃ NVL -->
                                <td
                                        th:text="${l.manvl_code}">
                                </td>


                                <!-- TÊN NVL -->
                                <td
                                        th:text="${l.tennvl}">
                                </td>


                                <!-- LOẠI NVL -->
                                <td
                                        th:text="${l.tenloai != null ? l.tenloai : 'Chưa phân loại'}">
                                </td>


                                <!-- SỐ LƯỢNG -->
                                <td
                                        th:text="${l.soluong}">
                                </td>


                                <!-- ĐƠN VỊ -->
                                <td
                                        th:text="${l.donvitinh}">
                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>


                    <!-- ========================= -->
                    <!-- ACTIONS -->
                    <!-- ========================= -->

                    <div class="ceo-form-actions">

                        <a
                                class="btn btn-back"
                                th:href="@{/kho/xuat-nvl}">

                            <i class="fas fa-arrow-left"></i>

                            Trở lại danh sách

                        </a>

                    </div>

                </div>

            </div>

        </main>

    </div>

</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        const serverError = /*[[${error}]]*/ null;

        const modal = document.getElementById("warehouse-error-modal");
        const messageElement = document.getElementById("warehouse-error-message");
        const closeButton = document.getElementById("close-warehouse-error");

        function closeWarehouseErrorModal() {
            modal.style.display = "none";
            document.body.style.overflow = "";
        }

        closeButton.addEventListener("click", closeWarehouseErrorModal);

        modal.addEventListener("click", function (event) {
            if (event.target === modal) {
                closeWarehouseErrorModal();
            }
        });

        document.addEventListener("keydown", function (event) {
            if (event.key === "Escape" && modal.style.display === "flex") {
                closeWarehouseErrorModal();
            }
        });

        if (serverError) {
            messageElement.textContent = serverError;
            modal.style.display = "flex";
            document.body.style.overflow = "hidden";
            closeButton.focus();
        }
    });
</script>

</body>

</html>
