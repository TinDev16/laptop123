<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>

<style>
    .bg-red-100 {
    background-color: #ffe5e5;
    }
    .modal {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4);
    }
    .modal-content {
        background: white; padding: 20px; border-radius: 10px;
        width: 400px;
    }
    .hidden { display: none; }

    .bg-red-100 {
        background-color: #ffe5e5;
    }

    .table-container h3 {
        color: #333;
        font-weight: 600;
    }

    /* Xóa gạch chân cho tất cả link trong nav */
    .nav a {
        text-decoration: none;
        color: inherit; /* Giữ nguyên màu gốc */
    }

    /* Tùy chỉnh khi rê chuột (hover) */
    .nav a:hover {
        text-decoration: none;
        color: #007bff;
    }

    .nav-tab.active {
        color: #007bff;
        font-weight: 600;
    }

</style>
<body>
<div class="app-container">
    <!-- SIDEBAR BÊN TRÁI -->
    <div th:replace="~{fragments/sidebar :: sidebar('thuonghieu')}"></div>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Quản Lý Thương Hiệu', 'Đối tác / Thương hiệu')}"></div>

        <main class="content-body">
            <div id="products" class="tab-content active" style="display: block;">
        <div class="page-header">
            <h2 class="page-title">Quản lý Thương hiệu</h2>
            <div class="page-actions">
                <a th:href="@{/thuonghieu/create}" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Thêm thương hiệu
                </a>
                <a href="#" class="btn btn-success" onclick="exportExcel()">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm thương hiệu..." onkeyup="filterProducts()">
            </div>
        </div>

        <div class="table-container">
            <table class="table">
                <thead>
                <tr>
                    <th>Mã thương hiệu</th>
                    <th>Tên thương hiệu</th>
                    <th>Trạng thái</th>
                    <!-- <th>Ghi chú</th> -->
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="products-table">
                <tr th:each="th : ${thuonghieu}"
                    th:if="${th.TRANGTHAI} == 0">
                    <td class="font-semibold" th:text="${th.MATHUONGHIEU}"></td>
                    <td th:text="${th.TENTHUONGHIEU}"></td>
                    <td th:text="${th.TRANGTHAI == 0 ? 'Hoạt động' : 'Đóng'}"></td>
                    <!-- <td th:text="${th.GHICHU != null ? th.GHICHU : ''}"></td> -->
                    <td>
                        <div class="table-actions">
                            <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-thuonghieu/{id}(id=${th.MATHUONGHIEU})}">
                                <i class="fas fa-edit"></i>
                            </a>
                            <!-- <a class="btn btn-icon btn-outline text-red-600" title="Xóa" th:href="@{/delete-thuonghieu/{id}(id=${th.MATHUONGHIEU})}">
                                <i class="fas fa-trash"></i>
                            </a> -->

                            <button
                                type="button"
                                class="btn btn-danger"
                                th:attr="data-id=${th.MATHUONGHIEU}, data-ten=${th.TENTHUONGHIEU}"
                                onclick="showDeleteModal(this)">
                                    Xóa
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>

            </table>

            <h1 style="margin: 20px 0 10px;">🚫Thương hiệu ngưng nhận</h1>
            <table class="table bg-red-100">
                <thead>
                <tr>
                    <th>Mã thương hiệu</th>
                    <th>Tên thương hiệu</th>
                    <th>Trạng thái</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="products-table">
                <tr th:each="th : ${thuonghieu}"
                    th:if="${th.TRANGTHAI} == 1">
                    <td class="font-semibold" th:text="${th.MATHUONGHIEU}"></td>
                    <td th:text="${th.TENTHUONGHIEU}"></td>
                    <td th:text="${th.TRANGTHAI == 0 ? 'Hoạt động' : 'Đóng'}"></td>
                    <td th:text="${th.GHICHU != null ? th.GHICHU : ''}"></td>
                    <td>
                        <div class="table-actions">
                            <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-thuonghieu/{id}(id=${th.MATHUONGHIEU})}">
                                <i class="fas fa-edit"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>


<!-- Modal xác nhận xóa -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3>Xóa thương hiệu</h3>
        <p id="deleteMessage"></p>
        <form th:action="@{/delete-thuonghieu}" method="POST">
            <input type="hidden" id="deleteId" name="id">
            <textarea name="GHICHU" placeholder="Nhập lý do xóa..." required></textarea>
            <div class="modal-actions">
                <button type="submit" class="btn btn-danger">Xác nhận</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </form>
    </div>
        </main>
    </div>
</div>

<script>
    function showDeleteModal(button) {
        const id = button.getAttribute('data-id');
        const ten = button.getAttribute('data-ten');
    
        // Gán giá trị vào modal
        document.getElementById("deleteId").value = id;
        document.getElementById("deleteMessage").textContent = `Bạn có chắc chắn muốn xóa thương hiệu "${ten}" không?`;
    
        // Hiện modal
        document.getElementById("deleteModal").classList.remove("hidden");
    }
    
    function closeModal() {
        document.getElementById("deleteModal").classList.add("hidden");
    }
</script>    

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    // --- Tìm kiếm cả 2 bảng ---
    function filterProducts() {
        const searchInput = document.getElementById('product-search').value.toLowerCase();
        const tables = document.querySelectorAll('.table'); // Lấy cả 2 bảng
        let visibleCount = 0;
    
        tables.forEach(table => {
            const rows = table.querySelectorAll('tbody tr');
            rows.forEach(row => {
                const tenThuongHieu = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
                const match = !searchInput || tenThuongHieu.includes(searchInput);
                row.style.display = match ? '' : 'none';
                if (match) visibleCount++;
            });
        });
    
        // Hiện thông báo nếu không có kết quả nào
        let noResultRow = document.getElementById('no-result-row');
        if (!noResultRow) {
            noResultRow = document.createElement('tr');
            noResultRow.id = 'no-result-row';
            noResultRow.innerHTML = `<td colspan="4" style="text-align:center;color:#dc3545;font-weight:500;">Không có thương hiệu phù hợp</td>`;
            tables[0].querySelector('tbody').appendChild(noResultRow);
        }
        noResultRow.style.display = (visibleCount === 0) ? '' : 'none';
    }
    
    // --- Xuất Excel cả 2 bảng ---
    function exportExcel() {
        const tables = document.querySelectorAll('.table');
        if (tables.length === 0) {
            alert("Không tìm thấy bảng thương hiệu!");
            return;
        }
    
        const wb = XLSX.utils.book_new();
    
        tables.forEach((table, index) => {
            const sheetName = index === 0 ? "ThuongHieu_HoatDong" : "ThuongHieu_NgungNhan";
            const ws = XLSX.utils.table_to_sheet(table);
            XLSX.utils.book_append_sheet(wb, ws, sheetName);
        });
    
        XLSX.writeFile(wb, 'thuonghieu.xlsx');
    }
    </script>
    
</body>
</html>
