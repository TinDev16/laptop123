<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Loại nguyên vật liệu</title>

    <link rel="stylesheet"
          th:href="@{/style.css(v='20261001-2')}">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
          rel="stylesheet">

</head>

<body>

<div class="app-container">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar('loai-nvl')}"></div>

    <div class="main-wrapper">

        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Loại nguyên vật liệu', 'Kho / NVL / Loại NVL')}"></div>

        <main class="content-body">

            <h1>Loại nguyên vật liệu</h1>

            <!-- THÔNG BÁO THÀNH CÔNG -->
            <p th:if="${success}"
               th:text="${success}"
               style="color:#15803d;">
            </p>

            <!-- THÔNG BÁO LỖI -->
            <p th:if="${error}"
               th:text="${error}"
               style="color:#dc2626;">
            </p>


            <!-- ============================== -->
            <!-- DANH SÁCH LOẠI NVL -->
            <!-- ============================== -->

            <div class="content-card">

                <div class="content-card-header">

                    <h2 class="content-card-title">
                        Quản lý loại nguyên vật liệu
                    </h2>

                    <span class="record-count"
                          th:text="${#lists.size(types) + ' loại'}">
                        0 loại
                    </span>

                </div>


                <!-- THANH CÔNG CỤ -->

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    padding:20px;
                    border-bottom:1px solid #e5e7eb;
                ">

                    <h3 style="
                        margin:0;
                        font-size:16px;
                        font-weight:600;
                    ">
                        Tất cả loại nguyên vật liệu
                    </h3>


                    <!-- NÚT HIỆN FORM THÊM -->

                    <button type="button"
                            class="btn btn-primary"
                            onclick="showAddTypeForm()">

                        <i class="fas fa-plus"></i>
                        Thêm loại nguyên vật liệu

                    </button>

                </div>


                <!-- ============================== -->
                <!-- FORM THÊM - MẶC ĐỊNH ẨN -->
                <!-- ============================== -->

                <div id="addTypeForm"
                     style="
                         display:none;
                         padding:20px;
                         border-bottom:1px solid #e5e7eb;
                         background:#f9fafb;
                     ">

                    <h3 style="
                        margin:0 0 20px 0;
                        font-size:16px;
                        font-weight:600;
                    ">
                        Thêm loại nguyên vật liệu
                    </h3>


                    <form method="post"
                          th:action="@{/nguyen-vat-lieu/loai}">

                        <div class="form-group">

                            <label for="name">
                                Tên loại nguyên vật liệu
                            </label>

                            <input type="text"
                                   id="name"
                                   name="name"
                                   maxlength="255"
                                   required
                                   placeholder="Nhập tên loại NVL"
                                   class="form-control">

                        </div>


                        <div style="margin-top:20px;">

                            <button type="submit"
                                    class="btn btn-primary">

                                <i class="fas fa-plus"></i>
                                Thêm

                            </button>


                            <button type="button"
                                    class="btn btn-secondary"
                                    onclick="hideAddTypeForm()"
                                    style="margin-left:8px;">

                                Hủy

                            </button>

                        </div>

                    </form>

                </div>


                <!-- ============================== -->
                <!-- BẢNG DANH SÁCH -->
                <!-- ============================== -->

                <div class="table-container">

                    <table>

                        <thead>

                        <tr>

                            <th>Mã loại</th>

                            <th>Tên loại nguyên vật liệu</th>

                            <th>Trạng thái</th>

                            <th>Thao tác</th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr th:each="type : ${types}">

                            <!-- MÃ LOẠI -->

                            <td th:text="${type.maloai}">
                                1
                            </td>


                            <!-- TÊN LOẠI -->

                            <td th:text="${type.tenloai}">
                                CPU
                            </td>


                            <!-- TRẠNG THÁI -->

                            <!-- TRẠNG THÁI -->

                            <!-- TRẠNG THÁI -->

                            <!-- TRẠNG THÁI -->
                            <td>

                                <span th:if="${type.trangthai == 1}"
                                      class="status-badge status-success">
                                    Hoạt động
                                </span>

                                <span th:if="${type.trangthai == 0}"
                                      class="status-badge status-danger">
                                    Ngừng sử dụng
                                </span>

                            </td>


                            <!-- THAO TÁC -->

                            <td>

                                <a th:href="@{/nguyen-vat-lieu/loai/{id}(id=${type.maloai})}"
                                   style="
                                       color:#2563eb;
                                       text-decoration:none;
                                   ">
                                    Sửa
                                </a>

                            </td>

                        </tr>


                        <!-- KHÔNG CÓ DỮ LIỆU -->

                        <tr class="empty-row"
                            th:if="${#lists.isEmpty(types)}">

                            <td colspan="4">
                                Chưa có loại nguyên vật liệu.
                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>


<!-- ============================== -->
<!-- JAVASCRIPT HIỆN / ẨN FORM -->
<!-- ============================== -->

<script>

    function showAddTypeForm() {

        const form = document.getElementById("addTypeForm");

        form.style.display = "block";

        document.getElementById("name").focus();
    }


    function hideAddTypeForm() {

        const form = document.getElementById("addTypeForm");

        form.style.display = "none";
    }

</script>

</body>
</html>
