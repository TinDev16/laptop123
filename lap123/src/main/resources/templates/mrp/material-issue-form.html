<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Lập đề nghị xuất NVL</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('xuat-nvl')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Lập đề nghị xuất NVL', 'Kho / Xuất NVL')}"></div><main class="content-body">
<h1>Lập đề nghị xuất NVL</h1><p th:if="${error}" th:text="${error}" style="color:#b91c1c"></p>
<label>Yêu cầu sản xuất được giao</label><select class="form-control" onchange="location.href='/kho/xuat-nvl/create?orderId='+this.value"><option value="">Chọn yêu cầu</option><option th:each="o : ${orders}" th:value="${o.mayeucau}" th:text="${'#' + o.mayeucau + ' - ' + o.tensp}" th:selected="${selectedOrder != null and selectedOrder == o.mayeucau}"></option></select>
<form th:if="${selectedOrder != null}" th:action="@{/kho/xuat-nvl}" method="post" class="content-card" style="padding:1.5rem"><input type="hidden" name="orderId" th:value="${selectedOrder}">
<div class="table-container"><table><thead><tr><th>NVL</th><th>Định mức</th><th>Hao hụt (%)</th><th>Cần</th><th>Tồn hiện tại</th><th>Thiếu hụt</th><th>SL đề nghị</th></tr></thead><tbody>
<tr th:each="l : ${lines}"><td th:text="${l.manvl_code + ' - ' + l.tennvl}"></td><td th:text="${l.soluong_dinhmuc}"></td><td th:text="${l.tyle_haohut}"></td><td th:text="${l.nhu_cau}"></td><td th:text="${l.soluongton}"></td><td th:text="${l.nhu_cau > l.soluongton ? l.nhu_cau - l.soluongton : 0}"></td><td><input type="hidden" name="materialId" th:value="${l.manvl}"><input name="quantity" type="number" min="1" required th:value="${l.nhu_cau}" class="form-control"></td></tr>
</tbody></table></div><label>Ghi chú</label><input name="note" maxlength="255" class="form-control"><button class="btn btn-primary" type="submit">Gửi đề nghị</button></form>
</main></div></div></body></html>
