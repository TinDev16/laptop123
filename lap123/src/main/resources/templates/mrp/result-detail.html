<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết kết quả sản xuất</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head>
<body><div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('ket-qua')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Chi tiết kết quả', 'Sản xuất / Kết quả')}"></div>
<main class="content-body mrp-entry-page"><div class="page-header"><div><h1 class="page-title" th:text="${'Kết quả sản xuất #' + result.maketqua}"></h1><p class="page-description">Thông tin ghi nhận và trạng thái xác nhận nhập kho.</p></div><a class="btn btn-outline" th:href="@{/san-xuat/ket-qua}">Về danh sách</a></div>
<div class="directory-alert directory-alert--success" th:if="${success}" th:text="${success}"></div><div class="directory-alert directory-alert--error" th:if="${error}" th:text="${error}"></div>
<section class="content-card"><div class="content-card-header"><h2 class="content-card-title">Thông tin kết quả</h2><span class="status-pill" th:text="${result.trangthai}"></span></div>
<div class="content-card-body"><dl class="ceo-detail-grid">
<div><dt>Yêu cầu sản xuất</dt><dd th:text="${'#' + result.mayeucau}"></dd></div><div><dt>Sản phẩm</dt><dd th:text="${result.tensp}"></dd></div>
<div><dt>Nhân viên thực hiện</dt><dd th:text="${result.hoten}"></dd></div><div><dt>Số lượng hoàn thành</dt><dd th:text="${result.soluonghoanthanh}"></dd></div>
<div class="ceo-detail-note"><dt>Ghi chú</dt><dd th:text="${result.ghichu != null and !#strings.isEmpty(result.ghichu) ? result.ghichu : 'Không có ghi chú'}"></dd></div>
</dl></div></section>
<form th:if="${manager and result.trangthai == 'CHO_XAC_NHAN'}" th:action="@{/san-xuat/ket-qua/{id}/confirm(id=${result.maketqua})}" method="post" class="ceo-detail-action" onsubmit="return confirm('Xác nhận nhập thành phẩm?')"><button type="submit" class="btn btn-primary">Xác nhận nhập kho</button></form>
</main></div></div></body></html>
