<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chi tiết yêu cầu sản xuất</title><link rel="stylesheet" th:href="@{/style.css}"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"></head><body>
<div class="app-container"><div th:replace="~{fragments/sidebar :: sidebar('mrp')}"></div><div class="main-wrapper"><div th:replace="~{fragments/sidebar :: topbar('Chi tiết yêu cầu sản xuất', 'MRP / Yêu cầu sản xuất')}"></div><main class="content-body">
<div class="page-header"><h1 class="page-title" th:text="${'Yêu cầu #' + order.mayeucau}"></h1><a th:href="@{/san-xuat/yeu-cau}" class="btn btn-outline">Về danh sách</a></div>
<div class="content-card"><div class="content-card-header"><h2 class="content-card-title">Thông tin yêu cầu</h2></div><div class="content-card-body"><p><strong>Sản phẩm:</strong> <span th:text="${order.tensp}"></span></p><p><strong>Số lượng cần:</strong> <span th:text="${order.soluongyeucau}"></span> &nbsp; <strong>Đã hoàn thành:</strong> <span th:text="${order.soluonghoanthanh}"></span> &nbsp; <strong>Còn lại:</strong> <span th:text="${order.soluongyeucau - order.soluonghoanthanh}"></span></p><p><strong>BOM áp dụng:</strong> <span th:text="${order.mabom}"></span> &nbsp; <strong>Nhân viên:</strong> <span th:text="${order.hoten}"></span></p><p><strong>Ngày giao:</strong> <span th:text="${order.ngayyeucau}"></span> &nbsp; <strong>Hạn:</strong> <span th:text="${order.hanhoanthanh}"></span> &nbsp; <strong>Trạng thái:</strong> <span class="status-pill" th:text="${order.trangthai}"></span></p></div></div>
<div class="content-card"><div class="content-card-header"><h2 class="content-card-title">BOM và nhu cầu nguyên vật liệu</h2></div><div class="table-container"><table><thead><tr><th>NVL</th><th>Định mức</th><th>Hao hụt (%)</th><th>Nhu cầu thực tế</th><th>Tồn hiện tại</th><th>Thiếu hụt</th></tr></thead><tbody><tr th:each="need : ${needs}"><td th:text="${need.code + ' - ' + need.name}"></td><td th:text="${need.standard + ' ' + need.unit}"></td><td th:text="${need.waste}"></td><td th:text="${need.needed}"></td><td th:text="${need.available}"></td><td th:text="${need.shortage}"></td></tr><tr class="empty-row" th:if="${#lists.isEmpty(needs)}"><td colspan="6">BOM chưa có nguyên vật liệu.</td></tr></tbody></table></div></div>
</main></div></div></body></html>
