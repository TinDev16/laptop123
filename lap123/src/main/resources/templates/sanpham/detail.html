<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Chi tiết ' + ${sanpham.TENSP}">Chi tiết sản phẩm</title>
    <meta name="description" th:content="'Thông tin chi tiết về ' + ${sanpham.TENSP} + ' - mã ' + ${sanpham.MASP}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Open Graph -->
    <meta property="og:title" th:content="'Chi tiết ' + ${sanpham.TENSP}"/>
    <meta property="og:description" th:content="'Thông tin chi tiết về ' + ${sanpham.TENSP}"/>
    <meta property="og:image" th:content="@{'/uploads/' + ${sanpham.HINHANHSP}}"/>
    <meta property="og:type" content="product"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e3f0ff 0%, #f8f9fa 100%);
            margin: 0;
            padding: 2rem;
        }
        .card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.12);
            padding: 2rem;
            max-width: 900px;
            margin: auto;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }
        .card img {
            width: 320px;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-content {
            flex: 1;
            min-width: 260px;
        }
        .card-title {
            font-size: 2.1rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: #1a237e;
            letter-spacing: 0.5px;
        }
        .card-info {
            margin-bottom: 0.9rem;
            font-size: 1.05rem;
        }
        .card-info strong {
            display: inline-block;
            width: 170px;
            color: #3949ab;
        }
        .badge {
            display: inline-block;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 1px 4px rgba(40,167,69,0.08);
            transition: transform 0.2s;
        }
        .badge-open {
            background: linear-gradient(90deg,#28a745 60%,#43e97b 100%);
            color: #fff;
        }
        .badge-closed {
            background: linear-gradient(90deg,#dc3545 60%,#ff6a6a 100%);
            color: #fff;
        }
        .actions {
            margin-top: 2rem;
        }
        .btn {
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-right: 12px;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,123,255,0.08);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(90deg,#007bff 60%,#00c6ff 100%);
            color: white;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid #007bff;
            color: #007bff;
        }
        .btn:hover, .btn:focus {
            background: #0056b3;
            color: #fff;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 16px rgba(0,123,255,0.16);
        }
        @media (max-width: 700px) {
            .card {
                flex-direction: column;
                padding: 1rem;
            }
            .card img {
                margin-bottom: 1rem;
                width: 100%;
            }
            .card-content {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
<main>
<div class="card">
    <!-- Ảnh sản phẩm -->
    <div>
        <img th:src="@{'/uploads/' + ${sanpham.HINHANHSP}}" th:alt="'Ảnh sản phẩm ' + ${sanpham.TENSP}" alt="Ảnh sản phẩm">
    </div>
    <!-- Nội dung chi tiết -->
    <div class="card-content">
        <h1 class="card-title" th:text="${sanpham.TENSP}">Tên sản phẩm</h1>
        <div class="card-info"><strong>Mã sản phẩm:</strong> <span th:text="${sanpham.MASP}"></span></div>
        <div class="card-info"><strong>Xuất xứ:</strong> <span th:text="${sanpham.XUATXU}"></span></div>
        <div class="card-info"><strong>Chip:</strong> <span th:text="${sanpham.CHIP}"></span></div>
        <div class="card-info"><strong>Hệ điều hành:</strong> <span th:text="${sanpham.HEDIEUHANH}"></span></div>
        <div class="card-info"><strong>Kích thước màn:</strong> <span th:text="${sanpham.KICHTHUOCMAN}"></span></div>
        <div class="card-info"><strong>Thương hiệu:</strong> <span th:text="${sanpham.THUONGHIEU}"></span></div>
        <div class="card-info">
            <strong>Trạng thái:</strong>
            <span th:if="${sanpham.TRANGTHAI == 1}" class="badge badge-open">Mở bán</span>
            <span th:if="${sanpham.TRANGTHAI == 0}" class="badge badge-closed">Ngừng bán</span>
        </div>
        <div class="actions">
            <a th:href="@{/sanpham}" class="btn btn-outline">
                <i class="fas fa-arrow-left"></i> Quay lại
            </a>
        </div>
    </div>
</div>
</main>
</body>
</html>
