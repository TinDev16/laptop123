<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Quản lý Cửa hàng Laptop</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<style>
    .bg-red-100 {
    background-color: #ffe5e5;
    }
    .modal {
        position: fixed; inset: 0; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0,0,0,0.4);
    }
    .modal-content {
        background: white; padding: 20px; border-radius: 10px;
        width: 400px;
    }
    .hidden { display: none; }

    .bg-red-100 {
        background-color: #ffe5e5;
    }

    .table-container h3 {
        color: #333;
        font-weight: 600;
    }

    /* Xóa gạch chân cho tất cả link trong nav */
    .nav a {
        text-decoration: none;
        color: inherit; /* Giữ nguyên màu gốc */
    }

    /* Tùy chỉnh khi rê chuột (hover) */
    .nav a:hover {
        text-decoration: none;
        color: #007bff;
    }

    .nav-tab.active {
        color: #007bff;
        font-weight: 600;
    }

</style>
<body>
<div class="app-container">
    <!-- SIDEBAR BÊN TRÁI -->
    <div th:replace="~{fragments/sidebar :: sidebar('sanpham')}"></div>

    <!-- KHÔNG GIAN NỘI DUNG CHÍNH -->
    <div class="main-wrapper">
        <!-- TOPBAR -->
        <div th:replace="~{fragments/sidebar :: topbar('Quản Lý Sản Phẩm & Linh Kiện', 'Danh mục / Sản phẩm')}"></div>

        <main class="content-body">
            <!-- Products Tab -->
            <div id="products" class="tab-content active" style="display: block;">
        <div class="page-header">
            <h2 class="page-title">Quản lý Sản phẩm</h2>
            <div class="page-actions">
                <a th:href="@{/sanpham/create}" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    Thêm sản phẩm
                </a>
                <a href="#" class="btn btn-success" onclick="exportExcel('products')">
                    <i class="fas fa-file-excel"></i>
                    Xuất Excel
                </a>
            </div>
        </div>

        <div class="search-filters">
            <div class="search-input">
                <i class="fas fa-search"></i>
                <input type="text" id="product-search" placeholder="Tìm kiếm sản phẩm..." onkeyup="filterProducts()">
            </div>
        </div>

        <div class="table-container">

            <table class="table">
                <thead>
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Hệ điều hành</th>
                    <th>Thương hiệu</th>
                    <th>Trạng thái</th>
                    <!-- <th>Ghi chú</th> -->
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="products-table">
                    <!-- Hiển thị SP có TRANGTHAI = 0 -->
                    <tr th:each="sp : ${sanpham}"
                        th:if="${sp.TRANGTHAI == 0}">
                        <td th:text="${sp.MASP}"></td>
                        <td th:text="${sp.TENSP}"></td>
                        <td th:text="${sp.HEDIEUHANH}"></td>
                        <td th:text="${sp.thuonghieu != null ? sp.thuonghieu.TENTHUONGHIEU : 'Không có'}"></td>
                        <td th:text="'Mở bán'"></td>
                        <!-- <td th:text="${sp.GHICHU != null ? sp.GHICHU : ''}"></td> -->
                        <td>
                            <div class="table-actions">
                                <a class="btn btn-icon btn-outline" th:href="@{/view-sanpham/{id}(id=${sp.MASP})}" title="Xem chi tiết">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-sanpham/{id}(id=${sp.MASP})}">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <button type="button"
                                        class="btn btn-danger"
                                        th:attr="data-id=${sp.MASP}, data-ten=${sp.TENSP}"
                                        onclick="showDeleteModal(this)">
                                    Xóa
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        
            <br><br><br>
            <h1 style="margin: 20px 0 10px;">🚫Sản phẩm ngừng bán</h1>
            <table class="table bg-red-100">
                <thead>
                <tr>
                    <th>Mã SP</th>
                    <th>Tên sản phẩm</th>
                    <th>Hệ điều hành</th>
                    <th>Thương hiệu</th>
                    <th>Trạng thái</th>
                    <th>Ghi chú</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody id="stopped-products">
                    <!-- Hiển thị SP có TRANGTHAI = 1 -->
                    <tr th:each="sp : ${sanpham}"
                        th:if="${sp.TRANGTHAI == 1}">
                        <td th:text="${sp.MASP}"></td>
                        <td th:text="${sp.TENSP}"></td>
                        <td th:text="${sp.HEDIEUHANH}"></td>
                        <td th:text="${sp.thuonghieu != null ? sp.thuonghieu.TENTHUONGHIEU : 'Không có'}"></td>
                        <td th:text="'Ngừng bán'"></td>
                        <td th:text="${sp.GHICHU != null ? sp.GHICHU : ''}"></td>
                        <td>
                            <div class="table-actions">
                                <a class="btn btn-icon btn-outline" th:href="@{/view/{id}(id=${sp.MASP})}" title="Xem chi tiết">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a class="btn btn-icon btn-outline" title="Sửa" th:href="@{/edit-sanpham/{id}(id=${sp.MASP})}">
                                    <i class="fas fa-edit"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
    </div>

<!-- Modal xác nhận xóa -->
<div id="deleteModal" class="modal hidden">
    <div class="modal-content">
        <h3>Xóa sản phẩm</h3>
        <p id="deleteMessage"></p>
        <form th:action="@{/delete-sanpham}" method="POST">
            <input type="hidden" id="deleteId" name="id">
            <textarea name="GHICHU" placeholder="Nhập lý do xóa..." required></textarea>
            <div class="modal-actions">
                <button type="submit" class="btn btn-danger">Xác nhận</button>
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Hủy</button>
            </div>
        </form>
    </div>
        </main>
    </div>
</div>
<script>
function showDeleteModal(button) {
    const id = button.getAttribute('data-id');
    const ten = button.getAttribute('data-ten');

    // Gán giá trị vào modal
    document.getElementById("deleteId").value = id;
    document.getElementById("deleteMessage").textContent = `Bạn có chắc chắn muốn xóa sản phẩm "${ten}" không?`;

    // Hiện modal
    document.getElementById("deleteModal").classList.remove("hidden");
}


function closeModal() {
    document.getElementById("deleteModal").classList.add("hidden");
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
function filterProducts() {
    const searchInput = document.getElementById('product-search').value.toLowerCase();

    // Hai bảng cần lọc
    const tables = [
        document.querySelectorAll('#products-table tr'),
        document.querySelectorAll('#stopped-products tr')
    ];

    // Duyệt qua từng bảng
    tables.forEach((rows, tableIndex) => {
        let visibleCount = 0;

        rows.forEach(row => {
            const maSp = row.querySelector('td:nth-child(1)')?.textContent.toLowerCase() || '';
            const tenSp = row.querySelector('td:nth-child(2)')?.textContent.toLowerCase() || '';
            const heDieuHanh = row.querySelector('td:nth-child(3)')?.textContent.toLowerCase() || '';
            const thuongHieu = row.querySelector('td:nth-child(4)')?.textContent.toLowerCase() || '';
            const trangThai = row.querySelector('td:nth-child(5)')?.textContent.toLowerCase() || '';
            const ghiChu = row.querySelector('td:nth-child(6)')?.textContent.toLowerCase() || '';

            // Kiểm tra có khớp không
            const match = !searchInput || (
                maSp.includes(searchInput) ||
                tenSp.includes(searchInput) ||
                heDieuHanh.includes(searchInput) ||
                thuongHieu.includes(searchInput) ||
                trangThai.includes(searchInput) ||
                ghiChu.includes(searchInput)
            );

            row.style.display = match ? '' : 'none';
            if (match) visibleCount++;
        });

        // Thêm hoặc hiển thị dòng "Không có sản phẩm phù hợp" riêng cho từng bảng
        const tableBody = tableIndex === 0 ? document.getElementById('products-table') : document.getElementById('stopped-products');
        let noResultRow = tableBody.querySelector('.no-result-row');
        if (!noResultRow) {
            noResultRow = document.createElement('tr');
            noResultRow.classList.add('no-result-row');
            noResultRow.innerHTML = `<td colspan="7" style="text-align:center;color:#dc3545;font-weight:500;">Không có sản phẩm phù hợp</td>`;
            tableBody.appendChild(noResultRow);
        }
        noResultRow.style.display = (visibleCount === 0) ? '' : 'none';
    });
}


// Xuất Excel toàn bộ bảng sản phẩm
function exportExcel(tab) {
    if (tab === 'products') {
        // Lấy 2 bảng: mở bán & ngừng bán
        const openTable = document.querySelectorAll('.table')[0];
        const stoppedTable = document.querySelectorAll('.table')[1];

        // Tạo workbook
        const wb = XLSX.utils.book_new();

        // Tạo 2 sheet từ 2 bảng
        const wsOpen = XLSX.utils.table_to_sheet(openTable);
        const wsStopped = XLSX.utils.table_to_sheet(stoppedTable);

        // Thêm vào workbook
        XLSX.utils.book_append_sheet(wb, wsOpen, "SanPham_MoBan");
        XLSX.utils.book_append_sheet(wb, wsStopped, "SanPham_NgungBan");

        // Xuất file Excel
        XLSX.writeFile(wb, 'sanpham.xlsx');
    }
}
</script>

</body>
</html>
